<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Jangan Panik Dulu — Overlay & Brand Color Preview (Mas Raka)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.161.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.161.0/examples/jsm/"
}}
</script>
<style>
/* ===== LOCKED BRAND IDENTITY (OPSI 2): Crisp White (#FFFFFF) x Deep Indigo (#261A66) x Solid Orange (#EF5F18) ===== */
:root, body[data-palette="0"], body[data-palette="1"], body[data-palette="2"]{
  --brand-orange:#EF5F18;
  --brand-blue:#261A66;
  --brand-white:#FFFFFF;
  --scrim-rgb:20,14,54;

  --logo-bg:#261A66; --logo-border:#EF5F18;

  --hook-stroke:#261A66;
  --hook-pill-bg:#261A66; --hook-pill-ink:#FFFFFF; --hook-pill-shadow:#EF5F18;

  --step-pill-bg:#FFFFFF; --step-pill-ink:#261A66; --step-pill-border:#261A66;
  --step-num-bg:#EF5F18; --step-num-ink:#FFFFFF;
  --prog-track:rgba(255,255,255,.45); --prog-fill:#EF5F18;

  --card-bg:#FFFFFF; --card-border:#261A66;
  --card-title:#261A66; --card-desc:#4A417A;
  --card-badge-bg:#261A66; --card-badge-ink:#FFFFFF;
  --card-pill-bg:#EF5F18; --card-pill-ink:#FFFFFF;
  --card-art-c1:#E5E0FA; --card-art-c2:#FAD2BE;

  --sub-bg:#FFFFFF; --sub-ink:#261A66; --sub-border:#261A66;
  --sub-hl-bg:#EF5F18; --sub-hl-ink:#FFFFFF;

  --safe:#0FA968; --danger:#EF5F18;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;background:#0F141A;overflow:hidden;
  font-family:"Plus Jakarta Sans",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
#stage{
  position:fixed;left:50%;top:50%;width:1080px;height:1920px;
  transform:translate(-50%,-50%) scale(1);overflow:hidden;
  background:linear-gradient(180deg,#E8F3FC 0%,#F5F9FD 42%,#EDE6DC 100%);
}
#gl{position:absolute;inset:0;width:1080px;height:1920px;display:block;z-index:1}
#OverlaySVG{position:absolute;inset:0;width:1080px;height:1920px;pointer-events:none;z-index:4}
#OverlaySVG line{stroke-width:5}
#line-c1,#line-c2{stroke:var(--danger)}
#dot-c1,#dot-c2{fill:var(--danger);stroke:#FFFFFF;stroke-width:4}
#line-c3{stroke:var(--safe)}
#dot-c3{fill:var(--safe);stroke:#FFFFFF;stroke-width:4}

#hud{position:absolute;inset:0;pointer-events:none;z-index:6}

/* Progressive Blur & Gradient Contrast Scrims (Halus & Seamless untuk Kontras Teks) */
.scrim-top{
  position:absolute;left:0;right:0;top:0;height:440px;
  background:linear-gradient(180deg,rgba(var(--scrim-rgb),.62) 0%,rgba(var(--scrim-rgb),.28) 52%,rgba(var(--scrim-rgb),0) 100%);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  mask-image:linear-gradient(180deg,#000 0%,#000 38%,transparent 100%);
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 38%,transparent 100%);
}
.scrim-bottom{
  position:absolute;left:0;right:0;bottom:0;height:420px;
  background:linear-gradient(0deg,rgba(var(--scrim-rgb),.64) 0%,rgba(var(--scrim-rgb),.28) 50%,rgba(var(--scrim-rgb),0) 100%);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
  mask-image:linear-gradient(0deg,#000 0%,#000 40%,transparent 100%);
  -webkit-mask-image:linear-gradient(0deg,#000 0%,#000 40%,transparent 100%);
}

/* ZONA 1: Brand Lockup Kiri Atas (Clean & Seamless ala @puckermanefacts) */
.logo{
  position:absolute;left:46px;top:52px;width:84px;height:84px;border-radius:24px;
  background:var(--logo-bg);border:4px solid var(--logo-border);
  box-shadow:0 10px 24px rgba(20,14,54,.24);
  display:flex;align-items:center;justify-content:center;
  color:#FFFFFF;font-weight:800;font-size:34px;letter-spacing:-.04em;
}
.logo small{
  position:absolute;left:102px;top:50%;transform:translateY(-50%);
  white-space:nowrap;color:#FFFFFF;font-size:25px;font-weight:800;letter-spacing:-.015em;
  text-shadow:0 2px 10px rgba(20,14,54,.45);
}

/* ZONA 2A: HOOK LOCKUP (Beat 1 — Teks Putih Outline #261A66 + Pill #261A66 Bayangan #EF5F18) */
#hook-card{
  position:absolute;left:46px;right:46px;top:194px;
  display:flex;flex-direction:column;align-items:center;gap:18px;
}
.hook-title{
  font-size:100px;font-weight:800;letter-spacing:-.035em;line-height:1;
  color:#FFFFFF;text-align:center;
  -webkit-text-stroke:15px var(--hook-stroke);paint-order:stroke fill;
  text-shadow:0 12px 26px rgba(20,14,54,.30);
}
.hook-pill{
  background:var(--hook-pill-bg);color:var(--hook-pill-ink);
  font-size:48px;font-weight:800;letter-spacing:-.02em;
  padding:16px 40px;border-radius:18px;transform:rotate(-2deg);
  border:4px solid #FFFFFF;
  box-shadow:0 10px 0 var(--hook-pill-shadow), 0 18px 34px rgba(20,14,54,.32);
}

/* ZONA 2B: CLEAN SEAMLESS STEP TRACKER (Default Beats 2-4 ala @puckermanefacts) */
#step-tracker{
  position:absolute;left:0;right:0;top:174px;
  display:flex;flex-direction:column;align-items:center;gap:16px;opacity:0;
}
.step-pill{
  display:inline-flex;align-items:center;gap:18px;
  background:var(--step-pill-bg);padding:10px 36px 10px 10px;border-radius:999px;
  border:3px solid var(--step-pill-border);
  box-shadow:0 12px 28px rgba(20,14,54,.22);
}
.step-num{
  width:62px;height:62px;border-radius:50%;
  background:var(--step-num-bg);color:var(--step-num-ink);
  font-family:"Space Grotesk","Plus Jakarta Sans",sans-serif;
  font-size:32px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.step-title{
  font-size:42px;font-weight:800;letter-spacing:-.025em;
  color:var(--step-pill-ink);white-space:nowrap;
}
.progress{display:flex;gap:12px}
.progress i{
  width:98px;height:11px;border-radius:99px;background:var(--prog-track);
  display:block;box-shadow:0 2px 8px rgba(20,14,54,.18);
}
.progress i.on{background:var(--prog-fill)}

/* ZONA 2C: CONTEXTUAL BENTO FACT CARD (Fleksibel — hanya muncul saat butuh highlight data/fakta sains) */
#bento-card{
  position:absolute;right:46px;top:338px;width:368px;
  background:var(--card-bg);border:3px solid var(--card-border);
  border-radius:28px;padding:22px 26px 24px;overflow:hidden;
  box-shadow:0 16px 34px rgba(20,14,54,.22);
  display:flex;flex-direction:column;gap:14px;
  opacity:0;
}
.bento-top{
  position:relative;z-index:2;display:flex;flex-direction:column;gap:6px;
}
.bento-kicker{
  font-family:"Space Grotesk","Plus Jakarta Sans",sans-serif;
  font-size:18px;font-weight:700;letter-spacing:.06em;
  color:var(--brand-orange);text-transform:uppercase;
}
.bento-title{
  font-size:56px;font-weight:800;letter-spacing:-.04em;line-height:1;
  color:var(--card-title);text-align:left;
}
.bento-desc{
  font-size:22px;font-weight:700;line-height:1.26;letter-spacing:-.01em;
  color:var(--card-desc);text-align:left;max-width:236px;
}
.bento-bottom{
  position:relative;z-index:2;display:flex;align-items:center;
}
.bento-pill{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--card-pill-bg);color:var(--card-pill-ink);
  font-size:20px;font-weight:800;letter-spacing:-.01em;
  padding:7px 18px;border-radius:999px;
}
.bento-pill svg{width:18px;height:18px;fill:currentColor;flex-shrink:0}
.bento-art{
  position:absolute;right:-10px;bottom:-12px;width:168px;height:168px;
  pointer-events:none;z-index:1;
}
.bento-art svg{width:100%;height:100%;display:block}

/* ZONA 3: 3D LEADER-LINE CALLOUTS (100% Solid Surface + Vector Icon) */
.callout{
  position:absolute;left:0;top:0;transform:translate(-50%,-50%);
  background:#FFFFFF;padding:12px 24px;border-radius:16px;
  font-size:32px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;opacity:0;
  box-shadow:0 12px 26px rgba(12,10,36,.22);
  display:inline-flex;align-items:center;gap:10px;
}
.callout svg{width:26px;height:26px;fill:currentColor;flex-shrink:0}
.callout.danger{color:var(--danger);border:4px solid var(--danger)}
.callout.safe{color:var(--safe);border:4px solid var(--safe)}

/* ZONA 4: SUBTITLE BAR SOLID PUTIH (OPSI 2) + VECTOR-SELECTED ORANGE HIGHLIGHT */
#sub-wrap{
  position:absolute;left:46px;right:46px;bottom:142px;display:flex;justify-content:center;
}
.sub-card{
  background:var(--sub-bg);color:var(--sub-ink);
  padding:18px 36px 20px;border-radius:24px;
  font-size:44px;font-weight:800;letter-spacing:-.02em;line-height:1.2;
  white-space:nowrap;box-shadow:0 14px 32px rgba(20,14,54,.26);
  border:3px solid var(--sub-border);
  display:inline-flex;align-items:center;gap:12px;
}
.sub-card em{
  font-style:normal;
  background:var(--sub-hl-bg);color:var(--sub-hl-ink);
  padding:4px 18px 6px;border-radius:12px;
  display:inline-block;
}

/* Switcher (disembunyikan saat capture) */
#switcher{
  position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:80;
  display:flex;gap:12px;align-items:center;
  background:rgba(24,30,38,.94);padding:10px 16px;border-radius:16px;color:#fff;font-size:12px;
}
body.clean-snap #switcher{display:none}
#switcher .sw-label{font-weight:800;color:#EF5F18;text-transform:uppercase}
#switcher .sw-row{display:flex;gap:6px;flex-wrap:wrap}
#switcher button{background:#2D3748;color:#fff;border:none;padding:7px 11px;border-radius:8px;font:600 12px inherit;cursor:pointer}
#switcher button.active{background:#EF5F18}
</style>
</head>
<body>

<div id="stage">
  <canvas id="gl"></canvas>

  <svg id="OverlaySVG" viewBox="0 0 1080 1920">
    <line id="line-c1" x1="0" y1="0" x2="0" y2="0" stroke="#EF5F18" stroke-width="5" opacity="0"/>
    <circle id="dot-c1" cx="0" cy="0" r="10" fill="#EF5F18" stroke="#FFF" stroke-width="4" opacity="0"/>

    <line id="line-c2" x1="0" y1="0" x2="0" y2="0" stroke="#EF5F18" stroke-width="5" opacity="0"/>
    <circle id="dot-c2" cx="0" cy="0" r="10" fill="#EF5F18" stroke="#FFF" stroke-width="4" opacity="0"/>

    <line id="line-c3" x1="0" y1="0" x2="0" y2="0" stroke="#0FA968" stroke-width="5" opacity="0"/>
    <circle id="dot-c3" cx="0" cy="0" r="10" fill="#0FA968" stroke="#FFF" stroke-width="4" opacity="0"/>
  </svg>

  <div id="hud">
    <div class="scrim-top"></div>
    <div class="scrim-bottom"></div>

    <!-- ZONA 1: Brand Lockup Kiri Atas -->
    <div class="logo">jpd<small>@janganpanikdulu</small></div>

    <!-- ZONA 2A: Hook Lockup (Beat 1) -->
    <div id="hook-card">
      <h1 class="hook-title">BAU GAS BOCOR?</h1>
      <div class="hook-pill">JANGAN NYALAKAN LAMPU!</div>
    </div>

    <!-- ZONA 2B: Clean Seamless Step Pill + Progress Bars ala @puckermanefacts (Beats 2-4) -->
    <div id="step-tracker">
      <div class="step-pill">
        <span class="step-num" id="tr-badge">1</span>
        <span class="step-title" id="tr-title">Jangan sentuh saklar</span>
      </div>
      <div class="progress"><i id="seg1" class="on"></i><i id="seg2"></i><i id="seg3"></i></div>
    </div>

    <!-- ZONA 2C: Contextual Bento Fact Card (Fleksibel — muncul saat perlu fakta sains) -->
    <div id="bento-card">
      <div class="bento-top">
        <span class="bento-kicker">FAKTA SAINS</span>
        <div class="bento-title" id="bento-title">2×</div>
        <p class="bento-desc" id="bento-desc">Gas elpiji lebih berat dari udara</p>
      </div>
      <div class="bento-bottom">
        <span class="bento-pill" id="bento-pill">
          <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-5-5m5 5l5-5M5 20h14" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
          <span>Turun ke Lantai</span>
        </span>
      </div>
      <div class="bento-art">
        <svg viewBox="0 0 200 200" fill="none">
          <g transform="translate(18,18) rotate(-8 90 90)">
            <rect x="16" y="126" width="154" height="30" rx="15" fill="var(--card-art-c2)"/>
            <rect x="34" y="88" width="126" height="28" rx="14" fill="var(--card-art-c1)"/>
            <path d="M68 20v46m0 0l-14-14m14 14l14-14" stroke="var(--card-art-c2)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M124 30v46m0 0l-14-14m14 14l14-14" stroke="var(--card-art-c1)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
        </svg>
      </div>
    </div>

    <!-- ZONA 3: 3D Callout Badges (Solid + SVG Icon) -->
    <div class="callout danger" id="call1">
      <svg viewBox="0 0 24 24"><path d="M13 2L4 14h7l-2 8 9-12h-7l2-8z"/></svg>
      <span>percikan 1.000°C</span>
    </div>
    <div class="callout danger" id="call2">
      <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-5-5m5 5l5-5M5 20h14" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      <span>gas mengendap</span>
    </div>
    <div class="callout safe" id="call3">
      <svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>
      <span>cabut regulator</span>
    </div>

    <!-- ZONA 4: Solid Subtitle Bar + Vector-Selected Keyword Highlight -->
    <div id="sub-wrap">
      <div class="sub-card" id="sub-card">Cium <em>bau gas</em> di dapur?</div>
    </div>
  </div>
</div>

<div id="switcher">
  <div class="sw-label">Mode Overlay:</div>
  <div class="sw-row">
    <button id="btn-p1" class="active">Seamless + Contextual Card</button>
    <button id="btn-p2">Pure Minimal (Tanpa Card)</button>
    <button id="btn-p3">Reset</button>
  </div>
  <div class="sw-label">Angle:</div>
  <div class="sw-row">
    <button id="btn-a0" class="active">Auto</button>
    <button id="btn-a1">1</button>
    <button id="btn-a2">2</button>
    <button id="btn-a3">3</button>
    <button id="btn-a4">4</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const $ = s => document.querySelector(s);
const Q = new URLSearchParams(location.search);
if (Q.has('clean') || Q.has('capture')) document.body.classList.add('clean-snap');

/* ============ 1. RENDERER & CAMERA (MENDUKUNG MULTI-ANGLE DINAMIS) ============ */
const W = 1080, H = 1920;
const renderer = new THREE.WebGLRenderer({ canvas: $('#gl'), antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, W / H, 0.2, 160);

const hemi = new THREE.HemisphereLight(0xFFFDF9, 0xD8CFC4, 1.65);
hemi.position.set(0, 18, 0);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xFFF7EB, 2.25);
sun.position.set(7.5, 13.5, 9.0);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sd = 6.8;
sun.shadow.camera.left = -sd;
sun.shadow.camera.right = sd;
sun.shadow.camera.top = sd;
sun.shadow.camera.bottom = -sd;
sun.shadow.bias = -0.0005;
scene.add(sun);

const rim = new THREE.DirectionalLight(0x90E0EF, 0.85);
rim.position.set(-7, 6, -5);
scene.add(rim);

const mat = (hex, rough = 0.45, metal = 0.03, emissive = 0x000000, emInt = 0) =>
  new THREE.MeshStandardMaterial({ color: hex, roughness: rough, metalness: metal, emissive, emissiveIntensity: emInt });

const outlineMat = new THREE.MeshBasicMaterial({ color: 0x181E26, side: THREE.BackSide });
function withOutline(mesh, scale = 1.065) {
  const out = new THREE.Mesh(mesh.geometry, outlineMat);
  out.scale.setScalar(scale);
  mesh.add(out);
  return mesh;
}

/* ============ 2. LINGKUNGAN DAPUR 3D DETAIL TINGGI (ENAK DILIHAT DARI SEGALA ANGLE) ============ */
const world = new THREE.Group();
scene.add(world);

function makeTileTexture() {
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 512;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#F6F4F0';
  ctx.fillRect(0, 0, 512, 512);
  ctx.strokeStyle = '#DFD9CE';
  ctx.lineWidth = 6;
  for (let i = 0; i <= 512; i += 64) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(2, 2);
  return tex;
}

function makeWoodTexture() {
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 512;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#E2B887';
  ctx.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 8; i++) {
    ctx.fillStyle = i % 2 === 0 ? '#E2B887' : '#D9AE7C';
    ctx.fillRect(0, i * 64, 512, 64);
    ctx.strokeStyle = '#C69868';
    ctx.lineWidth = 4;
    ctx.strokeRect(0, i * 64, 512, 64);
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// Lapisan Tanah & Rumput Cutaway
const soil = new THREE.Mesh(new THREE.BoxGeometry(7.2, 0.85, 7.2), mat(0x9C6B43, 0.75));
soil.position.y = -0.45;
world.add(soil);

const grass = new THREE.Mesh(new THREE.BoxGeometry(7.2, 0.16, 7.2), mat(0x52B788, 0.65));
grass.position.y = 0.02;
grass.receiveShadow = true;
world.add(grass);

const floorSlab = new THREE.Mesh(
  new THREE.BoxGeometry(5.6, 0.24, 5.6),
  new THREE.MeshStandardMaterial({ map: makeTileTexture(), roughness: 0.45 })
);
floorSlab.position.set(-0.1, 0.22, -0.1);
floorSlab.receiveShadow = true;
world.add(floorSlab);

// Dinding Belakang & Kiri (Warm Cream-White)
const wallBack = new THREE.Mesh(new THREE.BoxGeometry(5.6, 3.8, 0.28), mat(0xFBF9F5, 0.48));
wallBack.position.set(-0.1, 2.12, -2.85);
wallBack.castShadow = true;
wallBack.receiveShadow = true;
world.add(wallBack);

const wallLeft = new THREE.Mesh(new THREE.BoxGeometry(0.28, 3.8, 5.6), mat(0xF4F0EA, 0.48));
wallLeft.position.set(-2.85, 2.12, -0.1);
wallLeft.castShadow = true;
wallLeft.receiveShadow = true;
world.add(wallLeft);

// Jendela Dapur di Dinding Kiri
const winGroup = new THREE.Group();
winGroup.position.set(-2.68, 2.18, -0.35);
world.add(winGroup);
const winFrame = new THREE.Mesh(new THREE.BoxGeometry(0.10, 1.38, 1.62), mat(0x22272E, 0.35));
winGroup.add(winFrame);
const winSky = new THREE.Mesh(new THREE.BoxGeometry(0.06, 1.20, 1.44), new THREE.MeshBasicMaterial({ color: 0x90E0EF }));
winSky.position.x = 0.04;
winGroup.add(winSky);

const winSashPivot = new THREE.Group();
winSashPivot.position.set(0.07, 0, -0.72);
winGroup.add(winSashPivot);
const winSash = new THREE.Mesh(
  new THREE.BoxGeometry(0.07, 1.18, 1.40),
  new THREE.MeshStandardMaterial({ color: 0xCAF0F8, transparent: true, opacity: 0.65, roughness: 0.15 })
);
winSash.position.set(0, 0, 0.72);
winSashPivot.add(winSash);

// Kitchen Set Kayu Hangat + Kompor + Panci
const kitchenGroup = new THREE.Group();
kitchenGroup.position.set(-0.75, 0.34, -2.18);
world.add(kitchenGroup);

const baseCab = new THREE.Mesh(
  new RoundedBoxGeometry(2.65, 0.90, 0.92, 4, 0.03),
  new THREE.MeshStandardMaterial({ map: makeWoodTexture(), roughness: 0.48 })
);
baseCab.position.y = 0.45;
baseCab.castShadow = true;
baseCab.receiveShadow = true;
kitchenGroup.add(baseCab);

const counterTop = new THREE.Mesh(new RoundedBoxGeometry(2.74, 0.10, 0.98, 4, 0.02), mat(0xFFFFFF, 0.3));
counterTop.position.y = 0.93;

function makeSparkGeo(R = 0.36, r = 0.12, depth = 0.08) {
  const s = new THREE.Shape();
  for (let i = 0; i < 12; i++) {
    const a = (i * Math.PI) / 6 - Math.PI / 2;
    const rad = i % 2 === 0 ? R : r;
    const x = Math.cos(a) * rad, y = -Math.sin(a) * rad;
    if (i === 0) s.moveTo(x, y);
    else s.lineTo(x, y);
  }
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02, bevelSegments: 2 });
  g.center();
  return g;
}

// Tekstur wajah Mas-Mas Kalem, Dewasa, & Bisa Diandalkan (Proporsi Golden-Ratio, Tanpa Hidung Kentang)
function makeMasFaceTexture(variant = 0) {
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 512;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, 512, 512);

  ctx.fillStyle = '#181E26';
  ctx.strokeStyle = '#181E26';
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // 1. Alis maskulin tegas & tenang (di posisi natural wajah)
  ctx.lineWidth = 20;
  ctx.beginPath();
  // Alis kiri
  ctx.moveTo(112, 174);
  ctx.quadraticCurveTo(156, 160, 204, 172);
  // Alis kanan (sedikit terangkat kalem / meyakinkan)
  ctx.moveTo(308, 168);
  ctx.quadraticCurveTo(356, 152, 400, 170);
  ctx.stroke();

  // 2. Mata proporsional fokus & tenang (jarak ideal, tidak terlalu rapat)
  [158, 354].forEach(cx => {
    ctx.fillStyle = '#181E26';
    ctx.beginPath();
    ctx.roundRect(cx - 22, 202, 44, 58, 21);
    ctx.fill();
    // Highlight mata bersih
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.arc(cx - 7, 220, 9, 0, Math.PI * 2);
    ctx.fill();
  });

  // 3. Garis Hidung Minimalis Maskulin (Clean L-Bridge — jauh lebih rapi daripada bola 3D)
  ctx.strokeStyle = 'rgba(145, 92, 58, 0.78)';
  ctx.lineWidth = 10;
  ctx.beginPath();
  ctx.moveTo(256, 218);
  ctx.lineTo(248, 268);
  ctx.lineTo(268, 272);
  ctx.stroke();

  // 4. Khusus Desain 2 (Mas Damar): Kacamata Frame Persegi Tipis Maskulin (Sleek Rectangular Frame)
  if (variant === 1) {
    ctx.strokeStyle = '#1E293B';
    ctx.lineWidth = 11;
    // Frame kiri & kanan persegi modern
    ctx.beginPath();
    ctx.roundRect(100, 186, 116, 86, 16);
    ctx.roundRect(296, 186, 116, 86, 16);
    ctx.stroke();
    // Bridge tengah & gagang samping
    ctx.lineWidth = 10;
    ctx.beginPath();
    ctx.moveTo(216, 214); ctx.lineTo(296, 214);
    ctx.moveTo(64, 212); ctx.lineTo(100, 212);
    ctx.moveTo(412, 212); ctx.lineTo(448, 212);
    ctx.stroke();
  }

  // 5. Senyum tipis kalem & meyakinkan ("Tenang, jangan panik dulu")
  ctx.strokeStyle = '#181E26';
  ctx.lineWidth = 14;
  ctx.beginPath();
  if (variant === 1) {
    ctx.moveTo(210, 326);
    ctx.quadraticCurveTo(256, 350, 304, 324);
  } else {
    ctx.moveTo(208, 328);
    ctx.quadraticCurveTo(258, 350, 310, 316);
  }
  ctx.stroke();

  // 6. Khusus Desain 3 (Mas Bima): Kumis tipis & Goatee dagu rapi (Clean Adult Stubble)
  if (variant === 2) {
    ctx.strokeStyle = '#27201C';
    ctx.lineWidth = 11;
    ctx.beginPath();
    ctx.moveTo(212, 302);
    ctx.quadraticCurveTo(256, 292, 300, 302);
    ctx.stroke();

    ctx.lineWidth = 14;
    ctx.beginPath();
    ctx.moveTo(222, 378);
    ctx.quadraticCurveTo(256, 392, 290, 378);
    ctx.stroke();
  }

  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// Helper membuat Kepala 3D Mas-Mas (Siluet 100% seamless tanpa garis bocor di pipi)
function buildMasHead(bodyPivot, variant = 0) {
  const skinMat = mat(0xF1C29B, 0.36);

  // Leher proporsional
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.18, 0.22, 16), skinMat);
  neck.position.set(0, 0.86, 0);
  bodyPivot.add(neck);

  const headPivot = new THREE.Group();
  headPivot.position.y = 0.90;
  bodyPivot.add(headPivot);

  // Bentuk kepala maskulin clean
  const head = withOutline(
    new THREE.Mesh(new RoundedBoxGeometry(0.74, 0.74, 0.70, 8, 0.21), skinMat),
    1.065
  );
  head.position.y = 0.37;
  head.castShadow = true;
  headPivot.add(head);

  // Plane Wajah Ekspresi
  const facePlane = new THREE.Mesh(
    new THREE.PlaneGeometry(0.64, 0.64),
    new THREE.MeshBasicMaterial({ map: makeMasFaceTexture(variant), transparent: true })
  );
  facePlane.position.set(0, 0.37, 0.356);
  headPivot.add(facePlane);

  return headPivot;
}

// Helper Lengan dengan Lengan Bawah + Jam Tangan di Tangan Kiri (Ciri khas mas-mas yang bisa diandalkan)
function buildMasArms(bodyPivot, sleeveColor, isRolledOrShort = true, watchBandColor = 0x181E26) {
  const skinMat = mat(0xF1C29B, 0.36);
  const sleeveMat = mat(sleeveColor, 0.36);

  function makeArm(side) {
    const p = new THREE.Group();
    p.position.set(side * 0.47, 0.72, 0);

    if (isRolledOrShort) {
      // Lengan atas tertutup baju/kemeja gulung
      const upperSleeve = withOutline(
        new THREE.Mesh(new RoundedBoxGeometry(0.25, 0.36, 0.27, 5, 0.08), sleeveMat),
        1.08
      );
      upperSleeve.position.y = -0.13;
      p.add(upperSleeve);

      // Lipatan gulungan lengan (Cuff Roll)
      const cuffRoll = withOutline(
        new THREE.Mesh(new RoundedBoxGeometry(0.27, 0.09, 0.29, 4, 0.03), sleeveMat),
        1.07
      );
      cuffRoll.position.y = -0.29;
      p.add(cuffRoll);

      // Lengan bawah kulit (Forearm)
      const forearm = withOutline(
        new THREE.Mesh(new RoundedBoxGeometry(0.21, 0.30, 0.23, 5, 0.07), skinMat),
        1.08
      );
      forearm.position.y = -0.44;
      p.add(forearm);
    } else {
      const fullArm = withOutline(
        new THREE.Mesh(new RoundedBoxGeometry(0.25, 0.62, 0.27, 5, 0.08), sleeveMat),
        1.08
      );
      fullArm.position.y = -0.25;
      p.add(fullArm);
    }

    // Jam Tangan Simpel di Pergelangan Kiri (side === -1)
    if (side === -1) {
      const watchStrap = new THREE.Mesh(
        new RoundedBoxGeometry(0.23, 0.07, 0.25, 4, 0.02),
        mat(watchBandColor, 0.3)
      );
      watchStrap.position.y = -0.52;
      p.add(watchStrap);

      const watchDial = new THREE.Mesh(
        new RoundedBoxGeometry(0.11, 0.10, 0.04, 3, 0.01),
        mat(0x0F172A, 0.2)
      );
      watchDial.position.set(0, -0.52, 0.13);
      p.add(watchDial);
    }

    const hand = withOutline(
      new THREE.Mesh(new THREE.SphereGeometry(0.13, 16, 16), skinMat),
      1.08
    );
    hand.position.y = -0.60;
    p.add(hand);

    bodyPivot.add(p);
    return p;
  }

  return { armL: makeArm(-1), armR: makeArm(1) };
}

/* ---- DESAIN 3: "MAS BIMA" (Kaos Raglan Mustard-Charcoal + Sling Bag Hitam — Abang Andalan) ---- */
function buildMascot3_Bimo() {
  const root = new THREE.Group();
  const bodyPivot = new THREE.Group();
  bodyPivot.position.y = 0.72;
  root.add(bodyPivot);

  // Kaos Crewneck / Sweater Tipis warna Warm Mustard-Amber (#E09F3E) dengan Kerah Rib Charcoal
  const torso = withOutline(
    new THREE.Mesh(new RoundedBoxGeometry(0.70, 0.82, 0.45, 6, 0.12), mat(0xE09F3E, 0.38)),
    1.07
  );
  torso.position.y = 0.41;
  torso.castShadow = true;
  bodyPivot.add(torso);

  // Rib Kerah Bulat Hitam-Charcoal
  const neckRib = new THREE.Mesh(new RoundedBoxGeometry(0.36, 0.08, 0.47, 4, 0.03), mat(0x1E242B, 0.38));
  neckRib.position.set(0, 0.80, 0);
  bodyPivot.add(neckRib);

  // Tas Selempang Kecil Hitam Polos (Urban Crossbody Sling Bag — khas mas-mas praktis sehari-hari)
  const slingStrap = new THREE.Mesh(new RoundedBoxGeometry(0.11, 0.86, 0.48, 3, 0.025), mat(0x181E26, 0.35));
  slingStrap.position.set(0, 0.42, 0);
  slingStrap.rotation.z = 0.50;
  bodyPivot.add(slingStrap);

  const slingPouch = withOutline(
    new THREE.Mesh(new RoundedBoxGeometry(0.28, 0.17, 0.10, 4, 0.03), mat(0x181E26, 0.32)),
    1.06
  );
  slingPouch.position.set(-0.04, 0.44, 0.25);
  slingPouch.rotation.z = 0.50;
  bodyPivot.add(slingPouch);

  // Kepala Mas Bima (dengan kumis/stubble tipis dewasa) + Rambut Clean Taper Crop
  const headPivot = buildMasHead(bodyPivot, 2);
  const hairMat = mat(0x18181B, 0.36);

  const hairTop = withOutline(
    new THREE.Mesh(new RoundedBoxGeometry(0.76, 0.23, 0.72, 6, 0.09), hairMat),
    1.06
  );
  hairTop.position.set(0, 0.72, -0.01);
  headPivot.add(hairTop);

  // Potongan French Crop / Taper Pendek Rapi
  const cropFront = withOutline(
    new THREE.Mesh(new RoundedBoxGeometry(0.64, 0.14, 0.22, 4, 0.05), hairMat),
    1.06
  );
  cropFront.position.set(0, 0.69, 0.28);
  headPivot.add(cropFront);

  // Lengan Raglan 3/4 warna Charcoal (#232B35) + Jam Tangan Sporty
  const { armL, armR } = buildMasArms(bodyPivot, 0x232B35, true, 0xFF5A36);

  // Celana Jeans Indigo Gelap + Sneakers Abu-Putih
  function makeLeg(side) {
    const p = new THREE.Group();
    p.position.set(side * 0.19, 0.72, 0);
    const leg = withOutline(
      new THREE.Mesh(new RoundedBoxGeometry(0.29, 0.64, 0.32, 5, 0.07), mat(0x2B3A4A, 0.45)),
      1.08
    );
    leg.position.y = -0.32;
    p.add(leg);
    const shoe = withOutline(
      new THREE.Mesh(new RoundedBoxGeometry(0.31, 0.17, 0.42, 4, 0.05), mat(0xE2E8F0, 0.32)),
      1.08
    );
    shoe.position.set(0, -0.62, 0.05);
    p.add(shoe);
    root.add(p);
    return p;
  }
  const legL = makeLeg(-1);
  const legR = makeLeg(1);

  return { root, bodyPivot, headPivot, armL, armR, legL, legR };
}

/* ============ 4. KOREOGRAFI 4 SUDUT KAMERA BERBEDA (BUKAN HANYA ISOMETRIK!) ============ */
const S = {
  camX: 2.2, camY: 2.45, camZ: 4.85,
  lookX: 0.55, lookY: 1.42, lookZ: -1.25,
  fov: 35,

  cX: 0.45, cY: 0.34, cZ: -0.45, cRotY: 0.35,
  cArmL: -0.25, cArmR: -1.25,
  cKneel: 0,

  sparkScale: 0,
  gasOpacity: 0.38,
  regLift: 0,
  winOpen: 0,
  airOpacity: 0,

  c1Alpha: 0,
  c2Alpha: 0,
  c3Alpha: 0
};

function projectToScreen(vec3) {
  const v = vec3.clone().project(camera);
  return {
    x: (v.x * 0.5 + 0.5) * W,
    y: (-v.y * 0.5 + 0.5) * H
  };
}

function setCalloutLine(lineId, dotId, callEl, worldTarget, offsetX, offsetY, alpha) {
  const line = $(lineId), dot = $(dotId);
  if (alpha <= 0.01) {
    callEl.style.opacity = '0';
    line.setAttribute('opacity', '0');
    dot.setAttribute('opacity', '0');
    return;
  }
  const p = projectToScreen(worldTarget);
  const cx = p.x + offsetX;
  const cy = p.y + offsetY;
  callEl.style.left = `${cx}px`;
  callEl.style.top = `${cy}px`;
  callEl.style.opacity = alpha.toFixed(2);

  line.setAttribute('x1', p.x.toFixed(1));
  line.setAttribute('y1', p.y.toFixed(1));
  line.setAttribute('x2', cx.toFixed(1));
  line.setAttribute('y2', cy.toFixed(1));
  line.setAttribute('opacity', alpha.toFixed(2));

  dot.setAttribute('cx', p.x.toFixed(1));
  dot.setAttribute('cy', p.y.toFixed(1));
  dot.setAttribute('opacity', alpha.toFixed(2));
}

const DURATION = 12.0;
const tl = gsap.timeline({ paused: true });

// ANGLE 1 (0.0s - 3.0s): EYE-LEVEL MEDIUM SHOT (35 deg Perspective — Kenalan dengan Maskot & Situasi)
tl.fromTo(S,
  {
    camX: 2.35, camY: 2.65, camZ: 5.85,

  },

);

// ANGLE 2 (3.0s - 6.0s): OVER-THE-SHOULDER (OTS) MACRO SHOT (Fokus ke Saklar & Percikan 1.000°C)

}, 3.0);
tl.to(S, { cArmR: -0.55, duration: 0.65, ease: 'power2.out' }, 4.0);

// ANGLE 3 (6.0s - 9.0s): 3/4 HIGH-ANGLE CUTAWAY SHOT (Memperlihatkan Lapisan Gas Mengendap di Lantai)
tl.to(S, {

}, 6.0);

// ANGLE 4 (9.0s - 12.0s): LOW-ANGLE HERO ACTION SHOT (Cabut Regulator + Buka Jendela + Sign-Off)
tl.to(S, {
  camX: 2.15, camY: 1.85, camZ: 5.55,

  cX: -0.18, cZ: -0.85, cRotY: 0.28, cKneel: 0, cArmL: -0.35, cArmR: -2.15,
  regLift: 1, winOpen: 1, airOpacity: 1, gasOpacity: 0, c3Alpha: 1,
  duration: 0.9, ease: 'power3.inOut'
}, 9.0);

tl.to({}, { duration: 0.01 }, DURATION);

function updateHUD(t) {
  const hook = $('#hook-card'), tracker = $('#step-tracker'), bento = $('#bento-card'), sub = $('#sub-card');
  const segs = [$('#seg1'), $('#seg2'), $('#seg3')];

  const setStep = (n, title) => {
    $('#tr-badge').textContent = String(n);
    $('#tr-title').textContent = title;
    segs.forEach((s, i) => s.classList.toggle('on', i < n));
  };

  bento.style.opacity = '0';
  if (t < 3.0) {
    hook.style.opacity = '1';
    tracker.style.opacity = '0';
    sub.innerHTML = 'Cium <em>bau gas</em> di dapur?';
  } else if (t < 6.0) {
    hook.style.opacity = '0';
    tracker.style.opacity = '1';
    setStep(1, 'Jangan sentuh saklar');
    sub.innerHTML = 'Saklar memicu <em>percikan 1.000°C!</em>';
  } else if (t < 9.0) {
    hook.style.opacity = '0';
    tracker.style.opacity = '1';
    setStep(2, 'Gas turun ke lantai');
    // Bento Fact Card hanya muncul kontekstual saat dibutuhkan (fleksibel, bukan tiap beat)
    if (activePalette !== 1) bento.style.opacity = '1';
    sub.innerHTML = 'Gas elpiji <em>mengendap di lantai.</em>';
  } else {
    hook.style.opacity = '0';
    tracker.style.opacity = '1';
    setStep(3, 'Cabut & buka jendela');
    sub.innerHTML = 'Cabut regulator, <em>jangan panik dulu.</em>';
  }
}

function render(t) {
  updateHUD(t);

  camera.fov = S.fov;
  camera.updateProjectionMatrix();
  camera.position.set(S.camX, S.camY, S.camZ);
  camera.lookAt(S.lookX, S.lookY, S.lookZ);

  const kn = S.cKneel;
  const breath = Math.sin(t * 2.5) * 0.015;
  MASCOTS.forEach(m => {
    m.root.position.set(S.cX, S.cY + breath, S.cZ);
    m.root.rotation.y = S.cRotY;
    m.bodyPivot.position.y = 0.72 - kn * 0.22;
    m.armL.rotation.x = S.cArmL;
    m.armR.rotation.x = S.cArmR + (t >= 9.0 ? Math.sin(t * 7.0) * 0.18 : 0);
  });

  sparkBurst.visible = S.sparkScale > 0.01;
  sparkBurst.scale.setScalar(Math.max(0.001, S.sparkScale * (0.9 + 0.2 * Math.sin(t * 18))));
  sparkBurst.rotation.z = t * 3.5;

  gasVolumeGroup.visible = S.gasOpacity > 0.01;
  gasSlabMat.opacity = S.gasOpacity * 0.68;

  regulatorGroup.position.y = 0.80 + S.regLift * 0.48;
  regSwitch.rotation.z = S.regLift * (Math.PI * 0.5);
  winSashPivot.rotation.y = -S.winOpen * 1.05;

  airflowGroup.visible = S.airOpacity > 0.01;
  airArrows.forEach((ar, i) => {
    const p = (t * 0.75 + i * 0.33) % 1;
    ar.position.x = -2.35 + p * 0.95;
    ar.position.y = 2.28 - i * 0.20;
    ar.position.z = -1.78;
    ar.scale.setScalar(Math.max(0.001, Math.sin(p * Math.PI) * S.airOpacity));
  });

  setCalloutLine('#line-c1', '#dot-c1', $('#call1'), new THREE.Vector3(1.52, 1.92, -2.55), -145, -185, S.c1Alpha);
  setCalloutLine('#line-c2', '#dot-c2', $('#call2'), new THREE.Vector3(-0.15, 0.65, 0.55), 55, -140, S.c2Alpha);
  setCalloutLine('#line-c3', '#dot-c3', $('#call3'), new THREE.Vector3(1.25, 1.48, -1.85), -180, -165, S.c3Alpha);

  renderer.render(scene, camera);
}

/* ============ 5. STAGE SCALE & INTERACTIVE CONTROLS ============ */
const stage = $('#stage');
const fit = () => {
  const s = Math.min(innerWidth / W, innerHeight / H);
  stage.style.transform = `translate(-50%,-50%) scale(${s})`;
};
addEventListener('resize', fit);
fit();

let autoPlay = true;
(function frame() {
  const t = tl.time();
  render(t);
  requestAnimationFrame(frame);
})();

$('#btn-p1').onclick = () => setPersona(0);
$('#btn-p2').onclick = () => setPersona(1);
$('#btn-p3').onclick = () => setPersona(2);

function jumpAngle(t, btnId) {
  autoPlay = false;
  tl.pause(t);
  render(t);
  ['#btn-a0', '#btn-a1', '#btn-a2', '#btn-a3', '#btn-a4'].forEach(sel => $(sel).classList.toggle('active', sel === btnId));
}
$('#btn-a0').onclick = () => {
  autoPlay = true;
  tl.play(0);
  ['#btn-a0', '#btn-a1', '#btn-a2', '#btn-a3', '#btn-a4'].forEach(sel => $(sel).classList.toggle('active', sel === '#btn-a0'));
};
$('#btn-a1').onclick = () => jumpAngle(1.4, '#btn-a1');
$('#btn-a2').onclick = () => jumpAngle(4.5, '#btn-a2');
$('#btn-a3').onclick = () => jumpAngle(7.4, '#btn-a3');
$('#btn-a4').onclick = () => jumpAngle(10.4, '#btn-a4');

tl.eventCallback('onComplete', () => { if (autoPlay) tl.play(0); });

const seek = (t, personaIdx = null) => {
  if (personaIdx !== null) setPersona(personaIdx);
  tl.pause();
  tl.time(t, false);
  if (gsap.ticker.tick) gsap.ticker.tick();
  render(t);
};

window.OPENER = {
  tl,
  DURATION,
  W,
  H,
  seek,
  setPersona,
  S,
  render,
  ready: false
};

document.fonts.ready.then(() => {
  window.OPENER.ready = true;
  if (!Q.has('clean')) tl.play(0);
});
