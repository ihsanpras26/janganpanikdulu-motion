<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from './vendor/RoundedBoxGeometry.js';

const $ = s => document.querySelector(s);
const Q = new URLSearchParams(location.search);
if (Q.has('clean') || Q.has('capture')) document.body.classList.add('clean-snap');

/* ============ 1. RENDERER & CAMERA (NARROW-FOV @puckermanefacts ARCHITECTURAL LENS) ============ */
const W = 1080, H = 1920;
const renderer = new THREE.WebGLRenderer({
  canvas: $('#gl'),
  antialias: true,
  alpha: true,
  logarithmicDepthBuffer: true,
  preserveDrawingBuffer: true
});
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(24, W / H, 0.15, 180);

const hemi = new THREE.HemisphereLight(0xFFFDF9, 0xCED8E0, 1.72);
hemi.position.set(0, 20, 0);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xFFF7EA, 2.35);
sun.position.set(8.5, 15.0, 10.5);
scene.add(sun);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
const sd = 7.5;
sun.shadow.camera.left = -sd;
sun.shadow.camera.right = sd;
sun.shadow.camera.top = sd;
sun.shadow.camera.bottom = -sd;
sun.shadow.bias = -0.0005;

const rim = new THREE.DirectionalLight(0x90E0EF, 0.92);
rim.position.set(-8, 7, -6);
scene.add(rim);

const rotorHeatLight = new THREE.PointLight(0xFF4500, 0.0, 4.5);
scene.add(rotorHeatLight);

const caliperKeyLight = new THREE.PointLight(0xFFF7EA, 2.2, 4.8);
scene.add(caliperKeyLight);

const mat = (hex, rough = 0.42, metal = 0.05, emissive = 0x000000, emInt = 0) =>
  new THREE.MeshStandardMaterial({ color: hex, roughness: rough, metalness: metal, emissive, emissiveIntensity: emInt });

const outlineMat = new THREE.MeshBasicMaterial({ color: 0x181E26, side: THREE.BackSide });
function withOutline(mesh, scale = 1.055) {
  const out = new THREE.Mesh(mesh.geometry, outlineMat);
  out.scale.setScalar(scale);
  mesh.add(out);
  return mesh;
}

/* ============ 2. LINGKUNGAN JALAN TURUNAN PEGUNUNGAN & JALUR PENYELAMAT (3D DIORAMA) ============ */

// 3D Highway Overhead/Roadside Signboard: "JALUR PENYELAMAT"
function makeSignTexture(topTxt, botTxt, bgHex = '#EF5F18', txtHex = '#FFFFFF') {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 256;
  const cx = c.getContext('2d');
  cx.fillStyle = bgHex;
  cx.beginPath();
  cx.roundRect(8, 8, 496, 240, 28);
  cx.fill();
  cx.lineWidth = 12;
  cx.strokeStyle = txtHex;
  cx.stroke();
  cx.fillStyle = txtHex;
  cx.font = '800 54px "Plus Jakarta Sans", sans-serif';
  cx.textAlign = 'center';
  cx.fillText(topTxt, 256, 112);
  cx.font = '800 62px "Plus Jakarta Sans", sans-serif';
  cx.fillText(botTxt, 256, 188);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// Stylized Grass & Foliage Patches (Vibrant Greens + Wildflower Accents)
function makeFoliage(seed) {
  const g = new THREE.Group();
  const bladeMat = new THREE.MeshStandardMaterial({ color: seed % 2 === 0 ? 0x48A842 : 0x68C149, roughness: 0.72, metalness: 0.0, side: THREE.DoubleSide });
  for (let i = 0; i < 7; i++) {
    const blade = new THREE.Mesh(new THREE.ConeGeometry(0.09, 0.38 + ((seed + i) % 3) * 0.12, 4), bladeMat);
    blade.position.set(Math.cos(i * 1.1) * 0.18, 0.17, Math.sin(i * 1.1) * 0.18);
    blade.rotation.set(Math.sin(i) * 0.25, i * 0.9, Math.cos(i) * 0.25);
    g.add(blade);
  }
  if (seed % 3 === 0) {
    const flower = new THREE.Mesh(new THREE.SphereGeometry(0.055, 8, 8), new THREE.MeshBasicMaterial({ color: seed % 6 === 0 ? 0xFACC15 : 0xFB7185 }));
    flower.position.set(0.04, 0.36, 0.02);
    g.add(flower);
  }
  return g;
}
for (let i = 0; i < 36; i++) {
  const fol = makeFoliage(i);
  fol.userData.baseZ = -16.0 + i * (32.0 / 36.0);
  const isRight = i % 2 === 0;
  fol.position.set(isRight ? (4.15 + (i % 4) * 0.35) : (-2.55 - (i % 5) * 0.55), 0.02, fol.userData.baseZ);
  fol.scale.setScalar(0.85 + (i % 3) * 0.30);
  scrollingRoadGroup.add(fol);
}

const trafficCars = [];
function makePassingCar(bodyHex = 0x2563EB, isSUV = false) {
  const cg = new THREE.Group();
  const bodyLow = withOutline(
    new THREE.Mesh(new RoundedBoxGeometry(1.18, 0.44, 2.35, 5, 0.09), mat(bodyHex, 0.28, 0.18)),
    1.04
  );
  bodyLow.position.y = 0.36;
  bodyLow.castShadow = true;
  cg.add(bodyLow);

  const cabin = withOutline(
    new THREE.Mesh(new RoundedBoxGeometry(1.02, 0.38, isSUV ? 1.55 : 1.25, 5, 0.08), mat(bodyHex, 0.28, 0.18)),
    1.04
  );
  cabin.position.set(0, 0.68, isSUV ? -0.10 : -0.05);
  cg.add(cabin);

  const windshield = new THREE.Mesh(
    new RoundedBoxGeometry(1.04, 0.30, isSUV ? 1.42 : 1.14, 4, 0.05),
    mat(0x1E293B, 0.15, 0.65)
  );
  windshield.position.set(0, 0.68, isSUV ? -0.10 : -0.05);
  cg.add(windshield);

  // Headlights & Taillights
  [-0.38, 0.38].forEach(lx => {
    const hl = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.10, 0.05), new THREE.MeshBasicMaterial({ color: 0xFFFBEB }));
    hl.position.set(lx, 0.38, 1.16);
    const tlMesh = new THREE.Mesh(new THREE.BoxGeometry(0.24, 0.10, 0.05), new THREE.MeshBasicMaterial({ color: 0xEF4444 }));
    tlMesh.position.set(lx, 0.40, -1.16);
    cg.add(hl, tlMesh);
  });

  // 4 Wheels
  [[-0.58, 0.72], [0.58, 0.72], [-0.58, -0.72], [0.58, -0.72]].forEach(([wx, wz]) => {
    const w = new THREE.Mesh(new THREE.CylinderGeometry(0.22, 0.22, 0.18, 16), mat(0x151920, 0.8));
    w.rotation.z = Math.PI / 2;
    w.position.set(wx, 0.22, wz);
    cg.add(w);
  });
  return cg;
}

const faceCanvas = document.createElement('canvas');
faceCanvas.width = 512;
faceCanvas.height = 512;
const faceCtx = faceCanvas.getContext('2d');
const faceTexture = new THREE.CanvasTexture(faceCanvas);
faceTexture.colorSpace = THREE.SRGBColorSpace;
let lastFaceKey = '';

function updateRakaFace(mood = 'alert', isBlinking = false) {
  const key = `${mood}_${isBlinking ? 1 : 0}`;
  if (key === lastFaceKey) return;
  lastFaceKey = key;

  const ctx = faceCtx;
  ctx.clearRect(0, 0, 512, 512);
  ctx.fillStyle = '#181E26';
  ctx.strokeStyle = '#181E26';
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // 1. Eyebrows according to mood
  ctx.lineWidth = 20;
  ctx.beginPath();
  if (mood === 'panic') {
    // High angled worried brows
    ctx.moveTo(108, 182); ctx.quadraticCurveTo(156, 145, 206, 152);
    ctx.moveTo(306, 152); ctx.quadraticCurveTo(356, 145, 404, 182);
  } else if (mood === 'focused') {
    // Determined lower focused brows
    ctx.moveTo(110, 162); ctx.quadraticCurveTo(158, 158, 208, 176);
    ctx.moveTo(304, 176); ctx.quadraticCurveTo(354, 158, 402, 162);
  } else if (mood === 'smile') {
    // Relaxed warm brows
    ctx.moveTo(112, 174); ctx.quadraticCurveTo(156, 156, 204, 170);
    ctx.moveTo(308, 170); ctx.quadraticCurveTo(356, 156, 400, 174);
  } else {
    // 'alert' — surprised/curious raised brows
    ctx.moveTo(110, 168); ctx.quadraticCurveTo(156, 146, 204, 164);
    ctx.moveTo(308, 164); ctx.quadraticCurveTo(356, 146, 402, 168);
  }
  ctx.stroke();

  // 2. Eyes (with periodic blink or wide shock in panic)
  [158, 354].forEach(cx => {
    if (isBlinking) {
      ctx.lineWidth = 16;
      ctx.beginPath();
      ctx.moveTo(cx - 24, 252);
      ctx.quadraticCurveTo(cx, 260, cx + 24, 252);
      ctx.stroke();
    } else {
      const eyeH = mood === 'panic' ? 64 : 56;
      const eyeW = mood === 'panic' ? 48 : 44;
      ctx.fillStyle = '#181E26';
      ctx.beginPath();
      ctx.roundRect(cx - eyeW / 2, 222, eyeW, eyeH, 21);
      ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(cx - 7, 240, mood === 'panic' ? 10.5 : 9, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  // 3. Nose
  ctx.strokeStyle = 'rgba(145, 92, 58, 0.78)';
  ctx.lineWidth = 10;
  ctx.beginPath();
  ctx.moveTo(256, 238);
  ctx.lineTo(248, 288);
  ctx.lineTo(268, 292);
  ctx.stroke();

  // 4. Mouth according to mood
  ctx.strokeStyle = '#181E26';
  ctx.fillStyle = '#181E26';
  ctx.lineWidth = 14;
  ctx.beginPath();
  if (mood === 'panic') {
    // Open 'O' gasp mouth
    ctx.roundRect(228, 328, 56, 42, 20);
    ctx.fill();
  } else if (mood === 'alert') {
    // Slight tense curve
    ctx.moveTo(214, 352);
    ctx.quadraticCurveTo(256, 336, 298, 352);
    ctx.stroke();
  } else if (mood === 'focused') {
    // Firm confident line
    ctx.moveTo(212, 346);
    ctx.quadraticCurveTo(256, 352, 302, 342);
    ctx.stroke();
  } else {
    // 'smile' — warm confident smile
    ctx.moveTo(204, 344);
    ctx.quadraticCurveTo(258, 376, 312, 334);
    ctx.stroke();
  }

  faceTexture.needsUpdate = true;
}
updateRakaFace('alert', false);

/* ============ 6. SMOOTH EASE-IN / EASE-OUT & 100% VERBATIM SUBTITLE SCHEDULE (EP03 — 79.50s) ============ */
function easeOutBack(x) {
  const c1 = 1.70158;
  const c3 = c1 + 1;
  return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
}
function easeInQuad(x) {
  return x * x;
}
function easeOutCubic(x) {
  return 1 - Math.pow(1 - x, 3);
}

function getWindowMotion(t, tIn, tOut, enterDur = 0.36, exitDur = 0.26) {
  if (t < tIn || t > tOut) return { alpha: 0, y: -22, scale: 0.90 };
  if (t - tIn < enterDur) {
    const p = Math.max(0, Math.min(1, (t - tIn) / enterDur));
    const eb = easeOutBack(p);
    return {
      alpha: Math.min(1, p * 1.35),
      y: (1 - eb) * -24,
      scale: 0.88 + 0.12 * eb
    };
  }
  if (tOut - t < exitDur) {
    const p = Math.max(0, Math.min(1, (tOut - t) / exitDur));
    const eq = 1 - easeInQuad(1 - p);
    return {
      alpha: eq,
      y: (1 - eq) * -18,
      scale: 0.94 + 0.06 * eq
    };
  }
  return { alpha: 1, y: 0, scale: 1 };
}

const SPOKEN_WEIGHT_OVERRIDES = { '300': 9, 'CVT': 6, '3': 4 };
CAPTION_CHUNKS.forEach(ch => {
  if (ch.customTimes) {
    ch.wordTimes = ch.customTimes;
    return;
  }
  const weights = ch.words.map(w => SPOKEN_WEIGHT_OVERRIDES[w] || Math.max(2, w.replace(/[^a-zA-Z0-9]/g, '').length));
  const totalW = weights.reduce((a, b) => a + b, 0);
  const span = (ch.e - ch.s) * 0.94;
  let cursor = ch.s + 0.02;
  ch.wordTimes = ch.words.map((w, idx) => {
    const dur = (weights[idx] / totalW) * span;
    const wt = { word: w, ws: cursor, we: cursor + dur };
    cursor += dur;
    return wt;
  });
});

    document.body.classList.remove('cap-opt-1', 'cap-opt-2', 'cap-opt-3');
    document.body.classList.add(`cap-opt-${btn.dataset.cap}`);
    document.querySelectorAll('#switcher button[data-cap]').forEach(b => b.classList.toggle('active', b === btn));
  };
});

function setCalloutLine(lineId, dotId, callEl, worldTarget, offsetX, offsetY, alpha) {
  const line = $(lineId), dot = $(dotId);
  if (alpha <= 0.01) {
    callEl.style.opacity = '0';
    line.setAttribute('opacity', '0');
    dot.setAttribute('opacity', '0');
    return;
  }
  const v = worldTarget.clone().project(camera);
  const px = (v.x * 0.5 + 0.5) * W;
  const py = (-v.y * 0.5 + 0.5) * H;
  const cx = Math.max(220, Math.min(850, px + offsetX));
  const cy = Math.max(360, Math.min(1280, py + offsetY));

  const lineProg = easeOutCubic(Math.min(1, alpha * 1.35));
  const badgeProg = easeOutBack(Math.max(0, Math.min(1, (alpha - 0.18) / 0.82)));
  const badgeAlpha = Math.max(0, Math.min(1, (alpha - 0.15) / 0.65));

  const lx2 = px + (cx - px) * lineProg;
  const ly2 = py + (cy - py) * lineProg;

  line.setAttribute('x1', px.toFixed(1));
  line.setAttribute('y1', py.toFixed(1));
  line.setAttribute('x2', lx2.toFixed(1));
  line.setAttribute('y2', ly2.toFixed(1));
  line.setAttribute('opacity', Math.min(1, alpha * 1.4).toFixed(2));

  dot.setAttribute('cx', px.toFixed(1));
  dot.setAttribute('cy', py.toFixed(1));
  dot.setAttribute('r', (7 * Math.min(1.12, easeOutBack(Math.min(1, alpha * 1.5)))).toFixed(1));
  dot.setAttribute('opacity', Math.min(1, alpha * 1.5).toFixed(2));

  callEl.style.left = `${cx}px`;
  callEl.style.top = `${cy}px`;
  callEl.style.opacity = badgeAlpha.toFixed(2);
  const sc = (0.85 + 0.15 * badgeProg).toFixed(3);
  const ty = ((1 - badgeProg) * 12).toFixed(1);
  callEl.style.transform = `translate(-50%, calc(-50% + ${ty}px)) scale(${sc})`;
}

function updateHUD(t) {
  const hook = $('#hook-card'), tracker = $('#step-tracker'), subCard = $('#sub-card');
  const hookTitle = $('#hook-title'), hookPill = $('#hook-pill');
  const pillBox = $('#step-pill-box'), badgeEl = $('#tr-badge'), titleEl = $('#tr-title');
  const progWrap = $('#prog-wrap');
  const segs = [$('#seg1'), $('#seg2'), $('#seg3')];

  // 1. Update Top Header Segment
  const seg = TOP_SEGMENTS.find(x => t >= x.s && t <= x.e);
  if (!seg) {
    hook.style.opacity = '0';
    tracker.style.opacity = '0';
  } else if (seg.type === 'hook') {
    const m = getWindowMotion(t, seg.s, seg.e, 0.36, 0.26);
    tracker.style.opacity = '0';
    hook.style.opacity = m.alpha.toFixed(3);
    hook.style.transform = `translate3d(0, ${m.y.toFixed(1)}px, 0) scale(${m.scale.toFixed(3)})`;
    hookTitle.textContent = seg.hTitle;
    hookPill.textContent = seg.hPill;
  } else {
    const m = getWindowMotion(t, seg.s, seg.e, 0.36, 0.26);
    hook.style.opacity = '0';
    tracker.style.opacity = m.alpha.toFixed(3);
    tracker.style.transform = `translate3d(0, ${m.y.toFixed(1)}px, 0) scale(${m.scale.toFixed(3)})`;

    if (seg.badge) {
      badgeEl.style.display = 'flex';
      badgeEl.textContent = seg.badge;
      pillBox.classList.remove('text-only');
    } else {
      badgeEl.style.display = 'none';
      pillBox.classList.add('text-only');
    }
    titleEl.textContent = seg.title;
    progWrap.style.display = seg.showDots ? 'flex' : 'none';
    if (seg.showDots) segs.forEach((el, i) => el.classList.toggle('on', i < seg.prog));
  }

  // 2. Update Compact 3D Callout Text per Scene
  if (t < 10.18) {
    $('#call1-text').textContent = 'meluncur makin kencang';
  } else if (t < 16.16) {
    $('#call1-text').textContent = 'tuas rem terasa kosong';
  } else if (t < 22.30) {
    $('#call1-text').textContent = 'cakram 300°C+';
  } else if (t < 27.17) {
    $('#call1-text').textContent = 'minyak rem mendidih';
  } else if (t < 29.75) {
    $('#call2-text').textContent = 'gelembung uap (vapor lock)';
  } else if (t < 33.00) {
    $('#call2-text').textContent = 'rem langsung ngempos';
  } else if (t < 38.72) {
    $('#call1-text').textContent = 'kopling CVT terlepas';
  } else if (t < 44.34) {
    $('#call2-text').textContent = 'roda berputar bebas';
  } else if (t < 55.31) {
    $('#call3-text').textContent = 'pengereman mesin aktif';
  } else if (t < 61.48) {
    $('#call3-text').textContent = 'rem depan: tekan-lepas';
    $('#call4-text').textContent = 'rem belakang: tekan-lepas';
  } else if (t < 67.44) {
    $('#call3-text').textContent = 'berhenti bertahap';
  } else {
    $('#call1-text').textContent = 'minyak rem mendidih';
  }

  // 3. Update Verbatim Word-by-Word Subtitle Bar
  let activeChunk = CAPTION_CHUNKS.find(c => t >= c.s && t <= c.e);
  let gapAlpha = 1;
  if (!activeChunk) {
    activeChunk = CAPTION_CHUNKS.reduce((best, cur) => {
      const dist = Math.min(Math.abs(t - cur.s), Math.abs(t - cur.e));
      const bestDist = Math.min(Math.abs(t - best.s), Math.abs(t - best.e));
      return dist < bestDist ? cur : best;
    }, CAPTION_CHUNKS[0]);
    const minDist = Math.min(Math.abs(t - activeChunk.s), Math.abs(t - activeChunk.e));
    if (minDist > 0.14) {
      gapAlpha = Math.max(0, 1 - (minDist - 0.14) / 0.18);
    }
  }

  const dtChunk = Math.max(0, t - activeChunk.s);
  const popProg = Math.min(1, dtChunk / 0.18);
  const popEase = easeOutBack(popProg);
  const subScale = 0.97 + 0.03 * popEase;
  const subY = (1 - popEase) * 8 + (1 - gapAlpha) * 8;
  subCard.style.opacity = gapAlpha.toFixed(3);
  subCard.style.transform = `translate3d(0, ${subY.toFixed(1)}px, 0) scale(${subScale.toFixed(3)})`;

  let activeIdx = 0;
  for (let i = 0; i < activeChunk.wordTimes.length; i++) {
    if (t >= activeChunk.wordTimes[i].ws) activeIdx = i;
  }

  subCard.innerHTML = activeChunk.wordTimes.map((wt, idx) => {
    const stateCls = idx < activeIdx ? 'w past' : (idx === activeIdx ? 'w active' : 'w future');
    return `<span class="${stateCls}">${wt.word}</span>`;
  }).join(' ');
}

function getWorldAnchor(obj, localVec = new THREE.Vector3()) {
  scene.updateMatrixWorld(true);
  return localVec.clone().applyMatrix4(obj.matrixWorld);
}

function render(t) {
  updateHUD(t);
  const tr = $('#time-readout');
  if (tr) tr.textContent = `${t.toFixed(1).padStart(4, '0')}s / 79.5s`;

  const isOutroStage = S.outroWipeW > 0.72;
  stage.classList.toggle('outro-active', isOutroStage);

  // Toggle visibility during Outro Stage
  roadSlopeGroup.children.forEach(ch => {
    if (ch !== RAKA.root) ch.visible = !isOutroStage;
  });
  roadSlopeGroup.rotation.x = isOutroStage ? 0.0 : 0.11;
  RAKA.root.visible = true;
  RAKA.helmetGroup.visible = !isOutroStage;

  $('#wipe-orange').style.transform = `translate(-50%,-50%) scale(${S.outroWipeO.toFixed(4)})`;
  $('#wipe-indigo').style.transform = `translate(-50%,-50%) scale(${S.outroWipeI.toFixed(4)})`;
  $('#wipe-white').style.transform  = `translate(-50%,-50%) scale(${S.outroWipeW.toFixed(4)})`;
  $('#outro-circle-badge').style.transform = `translate(-50%,-50%) scale(${S.outroCircleScale.toFixed(4)})`;
  const barEl = $('#outro-bar'), btnEl = $('#outro-follow-btn');
  const curEl = $('#outro-cursor'), ripEl = $('#outro-ripple');
  const bp = S.outroBarProg, cp = S.outroCursorProg, kp = S.outroClickProg;

  barEl.style.opacity = Math.min(1, bp * 1.4).toFixed(3);
  barEl.style.transform = `translateY(${((1 - bp) * 36).toFixed(1)}px) scale(${(0.92 + 0.08 * bp).toFixed(3)})`;

  curEl.style.opacity = Math.min(1, cp * 1.6).toFixed(3);
  const clickPress = kp > 0 && kp < 0.45 ? 0.86 : 1.0;
  curEl.style.transform = `translate(${((1 - cp) * 95).toFixed(1)}px, ${((1 - cp) * 95).toFixed(1)}px) scale(${clickPress})`;

  const isFollowed = kp >= 0.35;
  btnEl.classList.toggle('followed', isFollowed);
  $('#outro-btn-label').textContent = isFollowed ? '✓ Mengikuti' : '+ Ikuti';
  const btnBounce = kp > 0 ? (1 + Math.sin(Math.min(1, kp) * Math.PI) * 0.09) : 1;
  btnEl.style.transform = `scale(${btnBounce.toFixed(3)})`;

  ripEl.style.opacity = kp > 0.2 ? Math.max(0, 1 - (kp - 0.2) * 1.3).toFixed(3) : '0';
  ripEl.style.transform = `scale(${(0.85 + kp * 0.55).toFixed(3)})`;

  // Update Camera
  camera.fov = S.fov;
  camera.updateProjectionMatrix();
  camera.position.set(S.camX, S.camY, S.camZ);
  camera.lookAt(S.lookX, isOutroStage ? S.lookY : (S.lookY - 0.12), S.lookZ);

  // 1. Road Scrolling & Wheel Rotation (Deterministic Function of Time t)
  const spd = S.roadSpeed;
  const scrollDist = (t * 7.5 * Math.max(0.15, spd)) % SCROLL_SPAN;
  scrollingRoadGroup.children.forEach(item => {
    if (item.userData && typeof item.userData.baseZ === 'number') {
      let z = item.userData.baseZ - (t * 7.5 * spd);
      z = ((z + 16.0) % SCROLL_SPAN + SCROLL_SPAN) % SCROLL_SPAN - 16.0;
      item.position.z = z;
    }
  });
  trafficCars.forEach(car => {
    const u = car.userData;
    let z = u.baseZ - (t * 7.5 * (spd - u.relSpeed));
    z = ((z + 16.0) % SCROLL_SPAN + SCROLL_SPAN) % SCROLL_SPAN - 16.0;
    car.position.z = z;
  });

  const wheelSpinAngle = t * 14.0 * spd;
  frontWheelSpinGroup.rotation.x = wheelSpinAngle;
  rearWheelSpinGroup.rotation.x = wheelSpinAngle;
  rearClutchBellGroup.rotation.x = wheelSpinAngle;

  // Engine RPM & CVT Centrifugal Clutch Shoes
  const engineRpmFactor = (1 - S.keyOff) * Math.max(0.35, spd * 0.85);
  frontPulleyGroup.rotation.x = t * 16.0 * engineRpmFactor;
  // When clutch is engaged (clutchDetach=0), shoes rotate with bell; when detached (clutchDetach=1), shoes stop while bell spins freely!
  clutchShoesGroup.rotation.x = wheelSpinAngle * (1 - S.clutchDetach);

  const shoeRadius = 0.077 - S.clutchDetach * 0.022;
  clutchShoeMeshes.forEach(sh => {
    sh.position.y = shoeRadius;
  });
  clutchShoeMat.emissive.setHex(S.cvtRingSafe > 0.5 ? 0x0FA968 : 0xEF5F18);
  clutchShoeMat.emissiveIntensity = S.cvtRingAlpha * 0.45;

  // CVT Cutaway Cover & Status Ring
  const cvtCut = S.cvtCutaway;
  cvtOuterCover.position.x = 0.035 + cvtCut * 0.18;
  cvtOuterCover.position.y = -cvtCut * 0.14;
  cvtOuterCover.rotation.z = -cvtCut * 0.45;
  cvtOuterCover.visible = cvtCut < 0.85;

  cvtRingMat.color.setHex(S.cvtRingSafe > 0.5 ? 0x0FA968 : 0xEF5F18);
  cvtRingMat.opacity = S.cvtRingAlpha * (0.82 + 0.18 * Math.sin(t * 9.0));
  cvtStatusRing.scale.setScalar(1.0 + 0.08 * Math.sin(t * 9.0));

  // 2. Scooter Position, Suspension Bounce, Steering & Speedometer
  const roadBounce = spd > 0.05 ? Math.sin(t * 18.0) * 0.008 * spd : 0;
  mioGroup.position.set(S.mioX, roadBounce, S.mioZ);
  mioGroup.rotation.set(S.mioPitch, S.mioYaw, S.mioRoll);
  steeringGroup.rotation.y = S.steerAngle;
  frontWheelAssy.rotation.y = S.steerAngle;

  // Speedometer needle angle correlates with speed
  speedoNeedlePivot.rotation.z = 0.85 - Math.min(2.2, spd * 0.95);

  // Ignition Key Rotation & Status Ring
  keyPivot.rotation.z = S.keyOff * (Math.PI * 0.42);
  keyRingMat.color.setHex(S.keyRingSafe > 0.5 ? 0x0FA968 : 0xEF5F18);
  keyRingMat.opacity = S.keyRingAlpha * (0.82 + 0.18 * Math.sin(t * 9.0));
  keyStatusRing.scale.setScalar(1.0 + 0.10 * Math.sin(t * 9.0));

  // Speed / Runaway Wind Vectors (S02 & S08)
  speedVectorsGroup.visible = S.speedVectorsAlpha > 0.02;
  speedVectorsGroup.position.set(S.mioX, 0, S.mioZ);
  speedArrows.forEach((arr, idx) => {
    const u = arr.userData;
    const cyc = ((t * 3.2 + u.phase) % 1.0);
    arr.position.set(u.x, u.y, -1.2 + cyc * 2.8);
    const sc = Math.sin(cyc * Math.PI) * S.speedVectorsAlpha;
    arr.scale.setScalar(Math.max(0.001, sc));
  });

  // 3. Brake Levers, Alternating Pump Rhythm (Step 2), Disc Rotor Heat & Caliper Cutaway
  const pumpR = S.pumpRhythm > 0.05 ? Math.max(0, Math.sin(t * 9.5)) * 0.85 * S.pumpRhythm : 0;
  const pumpL = S.pumpRhythm > 0.05 ? Math.max(0, -Math.sin(t * 9.5)) * 0.85 * S.pumpRhythm : 0;
  const effRightPull = Math.min(1, S.leverRightPull + pumpR + (t >= 27.2 && t <= 32.5 ? (0.5 + 0.45 * Math.sin(t * 11.0)) : 0));
  const effLeftPull  = Math.min(1, S.leverLeftPull + pumpL);

  brakeLeverRightPivot.rotation.y = effRightPull * 0.36;
  brakeLeverLeftPivot.rotation.y  = -effLeftPull * 0.36;
  throttleGripGroup.rotation.x    = S.throttleTwist * 0.45;

  // Disc Rotor 300C+ Glow & Heat Halo
  const heat = S.rotorHeat;
  discRotorMat.emissiveIntensity = heat * (1.35 + 0.25 * Math.sin(t * 14.0));
  rotorHeatHaloMat.opacity = Math.max(0, (heat - 0.25) * 0.78 * (0.85 + 0.15 * Math.sin(t * 12.0)));
  rotorHeatHalo.scale.setScalar(1.0 + 0.08 * Math.sin(t * 10.0));

  const rotorWorldPos = getWorldAnchor(discRotorGroup);
  rotorHeatLight.position.copy(rotorWorldPos).add(new THREE.Vector3(-0.25, 0.1, 0.1));
  rotorHeatLight.intensity = heat * 3.2;
  caliperKeyLight.position.copy(rotorWorldPos).add(new THREE.Vector3(-0.85, 0.35, 0.45));
  caliperKeyLight.intensity = ((t >= 16.1 && t <= 33.0) || (t >= 67.4 && t <= 72.6)) ? 3.2 : 0.8;

  // Caliper & Hose Exploded Breakdown Cutaway + Vapor Lock Bubbles (S05, S06, S13)
  const calCut = S.caliperCutaway;
  caliperOuterCover.position.x = -0.028 - calCut * 0.145;
  caliperOuterCover.position.y = calCut * 0.045;
  caliperOuterCover.rotation.z = calCut * 0.28;

  brakeHoseOuterMat.opacity = 1.0 - calCut * 0.72;
  caliperBodyMat.emissiveIntensity = heat * 0.55;
  padFrictionMat.emissiveIntensity = heat * 0.85;

  // Exploded view spreads out piston, fluid chamber, and dual pads slightly so all parts are clearly legible
  const padClampOffset = effRightPull * (1 - S.vaporBubbles * 0.92) * 0.010;
  brakePadMesh.position.x = -0.014 - calCut * 0.022 + padClampOffset;
  brakePadInnerMesh.position.x = 0.024 + calCut * 0.018 - padClampOffset;
  caliperPistonMesh.position.x = -0.034 - calCut * 0.048 + effRightPull * 0.012;
  caliperFluidChamber.position.x = -0.048 - calCut * 0.052;

  brakeFluidMat.color.setHex(S.vaporBubbles > 0.3 ? 0xFF6B00 : 0xF59E0B);

  vaporBubblesGroup.visible = S.vaporBubbles > 0.03;
  vaporBubbles.forEach((b, idx) => {
    const u = b.userData;
    const prog = (u.uBase + t * u.speed) % 0.72;
    if (u.inChamber) {
      b.position.set(
        -0.12 + Math.sin(t * 14.0 + idx) * 0.005,
        0.04 + prog * 0.08,
        -0.135 + Math.cos(t * 12.0 + idx) * 0.005
      );
    } else {
      const pt = brakeHoseCurve.getPointAt(Math.min(1, Math.max(0, prog)));
      b.position.set(
        pt.x + Math.sin(t * 14.0 + idx) * u.jitter,
        pt.y,
        pt.z + Math.cos(t * 12.0 + idx) * u.jitter
      );
    }
    const bScale = S.vaporBubbles * (0.85 + 0.28 * Math.sin(t * 16.0 + idx));
    b.scale.setScalar(Math.max(0.001, bScale));
  });

  // Escape Lane Green Safe Ring (Step 3)
  safeZoneRingMat.opacity = S.safeZoneAlpha * (0.75 + 0.25 * Math.sin(t * 7.0));
  safeZoneRing.scale.setScalar(1.0 + 0.06 * Math.sin(t * 7.0));

  // 4. Expressive & Fluid Mas Raka Character Rig
  const moodNames = ['alert', 'panic', 'focused', 'smile'];
  const curMood = isOutroStage ? 'smile' : (moodNames[Math.round(S.rakaMood)] || 'alert');
  // Periodic natural eye blink every ~3.4 seconds (except during intense panic)
  const blinkCycle = (t % 3.4);
  const isBlinking = curMood !== 'panic' && (blinkCycle > 3.18 && blinkCycle < 3.32);
  updateRakaFace(curMood, isBlinking);

  const breath = Math.sin(t * 3.2) * 0.010;
  const tenseJitter = (curMood === 'panic' && !isOutroStage) ? Math.sin(t * 28.0) * 0.006 : 0;

  if (isOutroStage) {
    // Outro Stage: Mas Raka centered in Circle Badge
    RAKA.root.position.set(0, 0.42 + S.mioPitch + breath, 0);
    RAKA.root.rotation.set(0, 0, 0);
    RAKA.bodyPivot.position.set(0, 0.72, 0);
    RAKA.bodyPivot.rotation.set(0, 0, 0);
    RAKA.legL.rotation.set(0, 0, 0);
    RAKA.legR.rotation.set(0, 0, 0);

    RAKA.armL.root.rotation.set(-0.25, 0, -0.14);
    RAKA.armL.forearmPivot.rotation.set(0, 0, 0);
    RAKA.armR.root.rotation.set(-2.35, 0, 0.28 + Math.sin(t * 7.5) * 0.10);
    RAKA.armR.forearmPivot.rotation.set(0, 0, 0);

    RAKA.headPivot.rotation.set(
      Math.sin(S.outroNod * Math.PI) * 0.16,
      Math.sin(t * 2.2) * 0.04,
      S.outroHeadTilt
    );
  } else if (S.rakaStand > 0.5) {
    // Scene 14 Sign-Off: Standing calmly beside the parked Red Yamaha Mio Smile
    RAKA.root.position.set(S.mioX + 1.05, 0.02 + breath, S.mioZ - 0.15);
    RAKA.root.rotation.set(0, 0.22, 0);
    RAKA.bodyPivot.position.set(0, 0.72, 0);
    RAKA.bodyPivot.rotation.set(0, 0, 0);
    RAKA.legL.rotation.set(0, 0, 0);
    RAKA.legR.rotation.set(0, 0, 0);

    RAKA.armL.root.rotation.set(-0.28, 0, 0.12);
    RAKA.armL.forearmPivot.rotation.set(-0.25, 0, 0);
    RAKA.armR.root.rotation.set(-1.65, 0, -0.25 - Math.sin(t * 5.5) * 0.08 * S.rakaWave);
    RAKA.armR.forearmPivot.rotation.set(-0.45, 0, 0);

    RAKA.headPivot.rotation.set(
      S.rakaHeadPitch + Math.sin(t * 2.5) * 0.04,
      S.rakaHeadYaw,
      S.rakaHeadRoll
    );
  } else {
    // Riding Seated on the Red Yamaha Mio Smile
    RAKA.root.position.set(S.mioX + tenseJitter, 0.44 + roadBounce * 1.35 + breath, S.mioZ - 0.48);
    RAKA.root.rotation.set(S.mioPitch, S.mioYaw, S.mioRoll);

    RAKA.bodyPivot.position.set(0, 0.68, 0);
    RAKA.bodyPivot.rotation.set(S.rakaLeanX, S.steerAngle * 0.35, -S.mioRoll * 0.45);

    // Seated knees bent forward onto Mio Smile floorboard
    RAKA.legL.rotation.set(-1.12, 0.12, 0);
    RAKA.legR.rotation.set(-1.12, -0.12, 0);

    // Right Arm realistically gripping the handlebar & Front Brake Lever (grip world pos: x=-0.28, y=1.10, z=0.34)
    RAKA.armR.root.rotation.set(-0.88 + S.throttleTwist * 0.12, -0.08 + S.steerAngle * 0.35, 0.18);
    RAKA.armR.forearmPivot.rotation.set(-0.56 - effRightPull * 0.08, -0.06, -0.14);
    RAKA.armR.handPivot.rotation.set(S.throttleTwist * 0.35 - 0.12, 0.15, -0.25);
    RAKA.armR.fingers.rotation.x = -0.25 - effRightPull * 0.55;

    // Left Arm: Either realistically gripping Left Handlebar Grip (x=+0.28, y=1.10, z=0.34) OR reaching toward Right Ignition Key
    const rk = S.rakaReachKey;
    RAKA.armL.root.rotation.set(
      -0.88 * (1 - rk) + (-0.82) * rk,
      0.08 * (1 - rk) + (-0.58) * rk,
      -0.18 * (1 - rk) + (-0.32) * rk
    );
    RAKA.armL.forearmPivot.rotation.set(-0.56 * (1 - rk) + (-0.48) * rk, 0.06 * (1 - rk), 0.14 * (1 - rk));
    RAKA.armL.handPivot.rotation.set(-0.12 * (1 - rk), -0.15 * (1 - rk), 0.25 * (1 - rk));
    RAKA.armL.fingers.rotation.x = (-0.25 - effLeftPull * 0.55) * (1 - rk);

    // Organic Head Tracking + Secondary Suspension Micro-Bob
    RAKA.headPivot.rotation.set(
      S.rakaHeadPitch + Math.sin(t * 6.5) * 0.018 * Math.min(1.5, spd),
      S.rakaHeadYaw + S.steerAngle * 0.5,
      S.rakaHeadRoll
    );
  }

  // Look at camera in scene 13
  if (t >= 67.44 && t <= 72.62) {
    RAKA.headPivot.rotation.set(0, -0.3, 0);
  }

  // 5. Dynamic 3D Callout World Anchors
  let c1Target = new THREE.Vector3();
  let c1OffX = 165, c1OffY = -145;
  if (t < 10.18) {
    // S02: Ignition / Scooter surging forward
    c1Target = getWorldAnchor(ignitionGroup);
    c1OffX = 175; c1OffY = -140;
  } else if (t < 16.16) {
    // S03: Right Brake Lever bottoming out
    c1Target = getWorldAnchor(brakeLeverRightMesh);
    c1OffX = 170; c1OffY = -135;
  } else if (t < 22.30) {
    // S04: 300C+ Disc Rotor
    c1Target = getWorldAnchor(discRotorGroup);
    c1OffX = 165; c1OffY = -150;
  } else if (t < 27.17) {
    // S05: Caliper & Boiling Brake Fluid
    c1Target = getWorldAnchor(caliperFluidChamber);
    c1OffX = 170; c1OffY = -140;
  } else if (t < 44.34) {
    // S07: CVT Centrifugal Clutch Shoes detached
    c1Target = getWorldAnchor(clutchShoesGroup);
    c1OffX = -165; c1OffY = -145;
  } else {
    // S13: Summary Takeaway — Boiling Brake Fluid in Caliper
    c1Target = getWorldAnchor(caliperFluidChamber);
    c1OffX = 175; c1OffY = -145;
  }

  let c2Target = new THREE.Vector3();
  let c2OffX = 165, c2OffY = -145;
  if (t < 29.75) {
    // S06A: Vapor Lock bubbles in hose
    c2Target = getWorldAnchor(caliperGroup, new THREE.Vector3(0, 0.14, 0));
    c2OffX = 165; c2OffY = -140;
  } else if (t < 33.00) {
    // S06B: Right Brake Lever squeezing to grip (ngempos)
    c2Target = getWorldAnchor(brakeLeverRightMesh);
    c2OffX = 170; c2OffY = -135;
  } else {
    // S08: Freewheeling Rear Wheel
    c2Target = getWorldAnchor(rearWheelAssy);
    c2OffX = -160; c2OffY = -150;
  }

  let c3Target = new THREE.Vector3();
  let c3OffX = 165, c3OffY = -145;
  if (t < 51.80) {
    // S10a: Ignition Key ON & Throttle Closed
    c3Target = getWorldAnchor(ignitionGroup);
    c3OffX = 165; c3OffY = -135;
  } else if (t < 55.31) {
    // S10b: Engaged CVT Clutch Shoes
    c3Target = getWorldAnchor(clutchShoesGroup);
    c3OffX = -165; c3OffY = -145;
  } else if (t < 61.48) {
    // S11: Right Front Brake Lever
    c3Target = getWorldAnchor(brakeLeverRightMesh);
    c3OffX = -175; c3OffY = -135;
  } else {
    // S12: Escape Lane Safe Stop
    c3Target = getWorldAnchor(mioGroup, new THREE.Vector3(0, 0.65, 0));
    c3OffX = 175; c3OffY = -145;
  }

  const c4Target = getWorldAnchor(brakeLeverLeftMesh);

  setCalloutLine('#line-c1', '#dot-c1', $('#call1'), c1Target, c1OffX, c1OffY, S.c1Alpha);
  setCalloutLine('#line-c2', '#dot-c2', $('#call2'), c2Target, c2OffX, c2OffY, S.c2Alpha);
  setCalloutLine('#line-c3', '#dot-c3', $('#call3'), c3Target, c3OffX, c3OffY, S.c3Alpha);
  setCalloutLine('#line-c4', '#dot-c4', $('#call4'), c4Target, 175, -135, S.c4Alpha);

  renderer.render(scene, camera);
}

/* ============ 7. STAGE SCALE & DETERMINISTIC CAPTURE HOOKS ============ */
const stage = $('#stage');
const fit = () => {
  const s = Math.min(innerWidth / W, innerHeight / H);
  stage.style.transform = `translate(-50%,-50%) scale(${s})`;
};
addEventListener('resize', fit);
fit();

const audioEl = $('#vo-audio');
let isPlaying = false;
const isDeterministicCapture = Q.has('clean') || Q.has('capture');

if (!isDeterministicCapture) {
  (function frame() {
    if (!window.THUMB_LOCK) {
      if (isPlaying && !audioEl.paused) {
        tl.time(audioEl.currentTime, false);
      }
      render(tl.time());
    }
    requestAnimationFrame(frame);
  })();
}

$('#btn-play').onclick = () => {
  if (audioEl.paused) {
    isPlaying = true;
    audioEl.play();
    tl.play(audioEl.currentTime);
    $('#btn-play').textContent = '⏸ Pause';
  } else {
    isPlaying = false;
    audioEl.pause();
    tl.pause();
    $('#btn-play').textContent = '▶ Play Master + Audio';
  }
};

document.querySelectorAll('#switcher button[data-t]').forEach(btn => {
  btn.onclick = () => {
    const t = parseFloat(btn.dataset.t);
    isPlaying = false;
    audioEl.pause();
    audioEl.currentTime = t;
    tl.pause(t);
    render(t);
    $('#btn-play').textContent = '▶ Play Master + Audio';
  };
});

const seek = (t) => {
  document.body.classList.add('clean-snap');
  isPlaying = false;
  tl.pause();
  tl.time(t, false);
  if (gsap.ticker.tick) gsap.ticker.tick();
  render(t);
  const gl = renderer.getContext();
  if (gl && gl.finish) gl.finish();
  return new Promise((resolve) => {
    requestAnimationFrame(() => {
      requestAnimationFrame(() => resolve(true));
    });
  });
};

window.OPENER = {
  tl,
  DURATION,
  W,
  H,
  seek,
  S,
  render,
  RAKA,
  renderer,
  scene,
  camera,
  world,
  mioGroup,
  frontWheelAssy,
  rearWheelAssy,
  caliperGroup,
  cvtGroup,
  ready: false
};

const avatarImg = $('#outro-avatar-img');
const avatarReady = avatarImg && avatarImg.decode
  ? avatarImg.decode().catch(() => {})
  : Promise.resolve();

Promise.all([document.fonts.ready, avatarReady]).then(() => {
  window.OPENER.ready = true;
  if (!Q.has('clean')) render(0);
});
</script>
</body>
