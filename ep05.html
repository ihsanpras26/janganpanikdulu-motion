<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from './vendor/RoundedBoxGeometry.js';

const $ = s => document.querySelector(s);
const Q = new URLSearchParams(location.search);
if (Q.has('clean') || Q.has('capture')) document.body.classList.add('clean-snap');

/* ============ 1. RENDERER & CAMERA ============ */
const W = 1080, H = 1920;
const renderer = new THREE.WebGLRenderer({
  canvas: $('#gl'),
  antialias: true,
  alpha: true,
  logarithmicDepthBuffer: true,
  preserveDrawingBuffer: true
});
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xC7D8E8, 12.2, 31.0);
const camera = new THREE.PerspectiveCamera(24, W / H, 0.15, 180);

const hemi = new THREE.HemisphereLight(0xFFFDF9, 0xBCCCD8, 1.75);
hemi.position.set(0, 20, 0);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xFFF7EA, 2.25);
sun.position.set(8.5, 15.0, 10.5);
scene.add(sun);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
const sd = 7.5;
sun.shadow.camera.left = -sd; sun.shadow.camera.right = sd;
sun.shadow.camera.top = sd;   sun.shadow.camera.bottom = -sd;
sun.shadow.bias = -0.0005;

const rim = new THREE.DirectionalLight(0x90E0EF, 0.95);
rim.position.set(-8, 7, -6);
scene.add(rim);

const impactLight = new THREE.PointLight(0xFF4500, 0.0, 5.0);
scene.add(impactLight);

const mat = (hex, rough = 0.42, metal = 0.05, emissive = 0x000000, emInt = 0) =>
  new THREE.MeshStandardMaterial({ color: hex, roughness: rough, metalness: metal, emissive, emissiveIntensity: emInt });

const outlineMat = new THREE.MeshBasicMaterial({ color: 0x181E26, side: THREE.BackSide });
function withOutline(mesh, scale = 1.055) {
  const out = new THREE.Mesh(mesh.geometry, outlineMat);
  out.scale.setScalar(scale);
  mesh.add(out);
  return mesh;
}

/* ============ 2. STAGE 0: JALAN BANJIR, TROTOAR KERING, & MOTOR MATIC MERAH ============ */
const floodRoadGroup = new THREE.Group();
scene.add(floodRoadGroup);

// Asphalt Flooded Road (Extended length 58m so horizon blends smoothly into fog)
const roadBase = new THREE.Mesh(
  new RoundedBoxGeometry(13.5, 0.45, 58.0, 4, 0.08),
  mat(0x2D3642, 0.80, 0.04)
);
roadBase.position.set(0.85, -0.225, -2.0);
roadBase.receiveShadow = true;
floodRoadGroup.add(roadBase);

// 2-Story Indonesian Ruko / Shophouses & Cross-Street Horizon Skyline
function makeShophouseBlock(w, h, d, wallHex, trimHex, awningHex) {
  const g = new THREE.Group();
  const wallMat = mat(wallHex, 0.82, 0.02);
  const winMat = mat(0x3B536D, 0.25, 0.35, 0x7DD3FC, 0.12);
  const frameMat = mat(0xF8FAFC, 0.55);

  const body = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 3, 0.08), wallMat);
  body.position.y = h * 0.5;
  g.add(body);

  // Roof Parapet Cornice
  const roofTrim = new THREE.Mesh(new RoundedBoxGeometry(w + 0.18, 0.26, d + 0.18, 3, 0.04), mat(trimHex, 0.65));
  roofTrim.position.y = h + 0.06;
  g.add(roofTrim);

  // Front facade faces +Z locally (rotate group +/-PI/2 along street)
  const frontZ = d * 0.5 + 0.02;
  // Ground-floor awning/kanopi (compact depth 0.52m, height y = 2.48 so S04 camera stays >0.4m clear)
  const awning = new THREE.Mesh(new RoundedBoxGeometry(w - 0.16, 0.14, 0.52, 3, 0.03), mat(awningHex, 0.62));
  awning.position.set(0, 2.48, frontZ + 0.22);
  awning.rotation.x = 0.16;
  g.add(awning);

  // Shopfront Roller Door / Window
  const shopWindow = new THREE.Mesh(new THREE.BoxGeometry(w * 0.68, 1.85, 0.06), mat(0x94A3B8, 0.55, 0.15));
  shopWindow.position.set(0, 1.05, frontZ);
  g.add(shopWindow);

  // Upper Floor Windows (3 across if wide, 2 if narrower)
  const cols = w >= 4.2 ? [-w * 0.26, 0, w * 0.26] : [-w * 0.22, w * 0.22];
  cols.forEach(wx => {
    const wf = new THREE.Mesh(new THREE.BoxGeometry(0.76, 1.05, 0.06), frameMat);
    wf.position.set(wx, h * 0.72, frontZ);
    const wg = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.88, 0.08), winMat);
    wg.position.set(wx, h * 0.72, frontZ + 0.01);
    g.add(wf, wg);
  });

  return g;
}

// Submerged Cars Stalled in Right Flooded Lane (with synchronous amber hazard blinkers)
const submergedCars = [];
function makeSubmergedCar(bodyHex, isSUV = false) {
  const g = new THREE.Group();
  const bodyMat = mat(bodyHex, 0.34, 0.28);
  const glassMat = mat(0x223042, 0.14, 0.45);
  const darkTrim = mat(0x1E293B, 0.65);

  const l = isSUV ? 3.15 : 2.95;
  const bodyH = isSUV ? 0.64 : 0.54;
  const cabH = isSUV ? 0.52 : 0.46;

  // Lower Chassis (half-submerged from wheel height up!)
  const hull = withOutline(new THREE.Mesh(new RoundedBoxGeometry(1.42, bodyH, l, 4, 0.10), bodyMat), 1.03);
  hull.position.y = 0.22 + bodyH * 0.5;
  g.add(hull);

  // Cabin & Dark Tinted Glass
  const cabLen = isSUV ? 1.92 : 1.48;
  const cabZ = isSUV ? -0.22 : -0.10;
  const cabin = withOutline(new THREE.Mesh(new RoundedBoxGeometry(1.24, cabH, cabLen, 4, 0.08), glassMat), 1.035);
  cabin.position.set(0, 0.22 + bodyH + cabH * 0.42, cabZ);
  const roof = new THREE.Mesh(new RoundedBoxGeometry(1.20, 0.07, cabLen - 0.16, 3, 0.03), bodyMat);
  roof.position.set(0, 0.22 + bodyH + cabH * 0.88, cabZ);
  g.add(cabin, roof);

  // Subtle Bumper & Partially Submerged Wheels
  const wheelMat = darkTrim;
  [-0.92, 0.92].forEach(wz => {
    [-0.64, 0.64].forEach(wx => {
      const wh = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.28, 0.18, 16), wheelMat);
      wh.rotation.z = Math.PI / 2;
      wh.position.set(wx, 0.28, wz);
      g.add(wh);
    });
  });

  // 4 Corner Amber Hazard Lamps (pulsed cleanly in render loop)
  const hazards = [];
  const hazMatF = new THREE.MeshStandardMaterial({ color: 0xF59E0B, emissive: 0xFF7A00, emissiveIntensity: 1.5, roughness: 0.2 });
  const hazMatR = new THREE.MeshStandardMaterial({ color: 0xF59E0B, emissive: 0xFF7A00, emissiveIntensity: 1.5, roughness: 0.2 });
  [-0.54, 0.54].forEach(hx => {
    const hF = new THREE.Mesh(new RoundedBoxGeometry(0.22, 0.12, 0.06, 2, 0.02), hazMatF);
    hF.position.set(hx, 0.22 + bodyH * 0.58, l * 0.5 + 0.01);
    const hR = new THREE.Mesh(new RoundedBoxGeometry(0.22, 0.12, 0.06, 2, 0.02), hazMatR);
    hR.position.set(hx, 0.22 + bodyH * 0.62, -l * 0.5 - 0.01);
    g.add(hF, hR);
    hazards.push(hazMatF, hazMatR);
  });

  // Waterline halo around car hull
  const halo = new THREE.Mesh(
    new THREE.RingGeometry(1.15, 1.24, 32),
    new THREE.MeshBasicMaterial({ color: 0xDCEEF8, transparent: true, opacity: 0.38, side: THREE.DoubleSide })
  );
  halo.rotation.x = -Math.PI / 2;
  halo.scale.set(0.74, 1.48, 1.0);
  halo.position.y = 0.427;
  g.add(halo);

  return { root: g, hazards };
}

function buildMiniCylinder(xPos, isWater) {

  sideL.position.set(-0.32, 0, -0.02);
  const sideR = withOutline(new THREE.Mesh(new RoundedBoxGeometry(0.12, 1.18, 0.42, 3, 0.025), cylMetalMat), 1.05);
  sideR.position.set(0.32, 0, -0.02);
  const cap = withOutline(new THREE.Mesh(new RoundedBoxGeometry(0.82, 0.20, 0.46, 4, 0.04), mat(0x64748B, 0.3, 0.5)), 1.04);

  const rod = withOutline(new THREE.Mesh(new RoundedBoxGeometry(0.075, 0.42, 0.06, 3, 0.015), mat(0xCBD5E1, 0.3, 0.7)), 1.06);
  rod.position.y = -0.28;

  if (!isWater) {
    const mist = [];
    for (let i = 0; i < 14; i++) {
      const m = new THREE.Mesh(new THREE.SphereGeometry(0.028, 8, 8), new THREE.MeshBasicMaterial({ color: 0x0FA968 }));
      m.userData = { nx: (((i * 23) % 100) / 100 - 0.5) * 0.34, ny: ((i * 41) % 100) / 100, nz: (((i * 17) % 100) / 100 - 0.5) * 0.14 };
      g.add(m);
      mist.push(m);
    }
    const okBadge = new THREE.Mesh(new THREE.RingGeometry(0.20, 0.25, 32), new THREE.MeshBasicMaterial({ color: 0x0FA968, side: THREE.DoubleSide }));
    okBadge.position.set(0, 0.86, 0.05);
    g.add(okBadge);

    const waterBlock = new THREE.Mesh(new THREE.CylinderGeometry(0.245, 0.245, 0.44, 22), chamberWaterMat);

    stopRing.position.set(0, 0.86, 0.05);

function buildOilTube(xPos, isEmulsified) {
  const g = new THREE.Group();

  const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.24, 0.96, 24), glassMat);

  // Oil Liquid Column
  const oilMat = isEmulsified
    ? new THREE.MeshStandardMaterial({ color: 0xC6A27E, roughness: 0.35, metalness: 0.02, transparent: true, opacity: 0.96 })
    : new THREE.MeshStandardMaterial({ color: 0xF59E0B, roughness: 0.12, metalness: 0.08, transparent: true, opacity: 0.88, emissive: 0xD97706, emissiveIntensity: 0.18 });
  const liquid = new THREE.Mesh(new THREE.CylinderGeometry(0.215, 0.215, 0.68, 24), oilMat);

  g.add(liquid);

  // Dipstick Dipped into Oil Tube
  const stick = withOutline(new THREE.Mesh(new RoundedBoxGeometry(0.055, 0.92, 0.028, 3, 0.008), mioDarkMetalMat), 1.07);
  stick.position.set(0, 0.24, 0.05);

  knob.position.set(0, 0.72, 0.05);
  g.add(stick, knob);

  // Water Emulsion Globules inside Kopi Susu Tube
  if (isEmulsified) {
    for (let i = 0; i < 12; i++) {
      const drop = new THREE.Mesh(new THREE.SphereGeometry(0.032 + (i % 3) * 0.012, 10, 10), new THREE.MeshBasicMaterial({ color: 0xE8DFD5 }));
      const a = (i / 12) * Math.PI * 2;
      drop.position.set(Math.cos(a) * 0.14, -0.38 + (i % 5) * 0.11, Math.sin(a) * 0.14);
      g.add(drop);
    }
  }

  // Semantic Status Ring
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(0.32, 0.38, 32),

  );
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = -0.49;
  g.add(ring);

  return g;
}

const faceCanvas = document.createElement('canvas');

const faceTexture = new THREE.CanvasTexture(faceCanvas);

let lastFaceKey = '';

function updateRakaFace(mood = 'alert', isBlinking = false) {
  const key = `${mood}_${isBlinking ? 1 : 0}`;
  if (key === lastFaceKey) return;
  lastFaceKey = key;
  const ctx = faceCtx;
  ctx.clearRect(0, 0, 512, 512);
  ctx.fillStyle = '#181E26'; ctx.strokeStyle = '#181E26';
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';

  ctx.lineWidth = 20;
  ctx.beginPath();
  if (mood === 'panic') {
    ctx.moveTo(108, 182); ctx.quadraticCurveTo(156, 145, 206, 152);
    ctx.moveTo(306, 152); ctx.quadraticCurveTo(356, 145, 404, 182);
  } else if (mood === 'focused') {
    ctx.moveTo(110, 162); ctx.quadraticCurveTo(158, 158, 208, 176);
    ctx.moveTo(304, 176); ctx.quadraticCurveTo(354, 158, 402, 162);
  } else if (mood === 'smile') {
    ctx.moveTo(112, 174); ctx.quadraticCurveTo(156, 156, 204, 170);
    ctx.moveTo(308, 170); ctx.quadraticCurveTo(356, 156, 400, 174);
  } else {
    ctx.moveTo(110, 168); ctx.quadraticCurveTo(156, 146, 204, 164);
    ctx.moveTo(308, 164); ctx.quadraticCurveTo(356, 146, 402, 168);
  }
  ctx.stroke();

  [158, 354].forEach(cx => {
    if (isBlinking) {
      ctx.lineWidth = 16; ctx.beginPath();
      ctx.moveTo(cx - 24, 252); ctx.quadraticCurveTo(cx, 260, cx + 24, 252); ctx.stroke();
    } else {
      const eyeH = mood === 'panic' ? 64 : 56, eyeW = mood === 'panic' ? 48 : 44;
      ctx.fillStyle = '#181E26'; ctx.beginPath(); ctx.roundRect(cx - eyeW / 2, 222, eyeW, eyeH, 21); ctx.fill();
      ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.arc(cx - 7, 240, mood === 'panic' ? 10.5 : 9, 0, Math.PI * 2); ctx.fill();
    }
  });

  ctx.strokeStyle = 'rgba(145, 92, 58, 0.78)'; ctx.lineWidth = 10;
  ctx.beginPath(); ctx.moveTo(256, 238); ctx.lineTo(248, 288); ctx.lineTo(268, 292); ctx.stroke();

  ctx.strokeStyle = '#181E26'; ctx.fillStyle = '#181E26'; ctx.lineWidth = 14;
  ctx.beginPath();
  if (mood === 'panic') { ctx.roundRect(228, 328, 56, 42, 20); ctx.fill(); }
  else if (mood === 'alert') { ctx.moveTo(214, 352); ctx.quadraticCurveTo(256, 336, 298, 352); ctx.stroke(); }
  else if (mood === 'focused') { ctx.moveTo(212, 346); ctx.quadraticCurveTo(256, 352, 302, 342); ctx.stroke(); }
  else { ctx.moveTo(204, 344); ctx.quadraticCurveTo(258, 376, 312, 334); ctx.stroke(); }
  faceTexture.needsUpdate = true;
}
updateRakaFace('alert', false);

function easeOutBack(x) { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
function easeInQuad(x) { return x * x; }
function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }

function getWindowMotion(t, tIn, tOut, enterDur = 0.32, exitDur = 0.24) {
  if (t < tIn || t > tOut) return { alpha: 0, y: -22, scale: 0.90 };
  if (t - tIn < enterDur) {
    const p = Math.max(0, Math.min(1, (t - tIn) / enterDur));
    const eb = easeOutBack(p);
    return { alpha: Math.min(1, p * 1.35), y: (1 - eb) * -22, scale: 0.88 + 0.12 * eb };
  }
  if (tOut - t < exitDur) {
    const p = Math.max(0, Math.min(1, (tOut - t) / exitDur));
    const eq = 1 - easeInQuad(1 - p);
    return { alpha: eq, y: (1 - eq) * -18, scale: 0.94 + 0.06 * eq };
  }
  return { alpha: 1, y: 0, scale: 1 };
}

function setCalloutLine(lineId, dotId, callEl, worldTarget, offsetX, offsetY, alpha) {
  const line = $(lineId), dot = $(dotId);
  if (alpha <= 0.01) {
    callEl.style.opacity = '0';
    line.setAttribute('opacity', '0');
    dot.setAttribute('opacity', '0');
    return;
  }
  const v = worldTarget.clone().project(camera);
  const px = (v.x * 0.5 + 0.5) * W;
  const py = (-v.y * 0.5 + 0.5) * H;
  const cx = Math.max(220, Math.min(860, px + offsetX));
  const cy = Math.max(360, Math.min(1260, py + offsetY));

  const lineProg = easeOutCubic(Math.min(1, alpha * 1.35));
  const badgeProg = easeOutBack(Math.max(0, Math.min(1, (alpha - 0.18) / 0.82)));
  const badgeAlpha = Math.max(0, Math.min(1, (alpha - 0.15) / 0.65));

  line.setAttribute('x1', px.toFixed(1));
  line.setAttribute('y1', py.toFixed(1));
  line.setAttribute('x2', (px + (cx - px) * lineProg).toFixed(1));
  line.setAttribute('y2', (py + (cy - py) * lineProg).toFixed(1));
  line.setAttribute('opacity', Math.min(1, alpha * 1.4).toFixed(2));

  dot.setAttribute('cx', px.toFixed(1));
  dot.setAttribute('cy', py.toFixed(1));
  dot.setAttribute('r', (7 * Math.min(1.12, easeOutBack(Math.min(1, alpha * 1.5)))).toFixed(1));
  dot.setAttribute('opacity', Math.min(1, alpha * 1.5).toFixed(2));

  callEl.style.left = `${cx}px`;
  callEl.style.top = `${cy}px`;
  callEl.style.opacity = badgeAlpha.toFixed(2);
  const sc = (0.85 + 0.15 * badgeProg).toFixed(3);
  const ty = ((1 - badgeProg) * 12).toFixed(1);
  callEl.style.transform = `translate(-50%, calc(-50% + ${ty}px)) scale(${sc})`;
}

  }).join(' ');
}

      rp.material.opacity = (1 - cyc) * 0.65;
      rp.position.x = S.mioX;
      rp.position.z = rp.userData.isFront ? 1.05 : -0.92;
      rp.visible = S.mioY < 0.1;
    });
    const hazGlow = (Math.sin(t * 9.5) > 0) ? 1.85 : 0.08;
    submergedCars.forEach(car => {
      car.hazards.forEach(hm => { hm.emissiveIntensity = hazGlow; });
    });

    // Starter Button & Ring
    starterBtnMesh.position.z = -0.052 + S.starterPress * 0.012;
    starterRingMat.opacity = S.starterRingAlpha * (0.75 + 0.25 * Math.sin(t * 9.0));
    starterRing.scale.setScalar(1.0 + 0.12 * Math.sin(t * 9.0));

    // Ignition Key & Dry Ring
    keyPivot.rotation.z = S.keyOff * (Math.PI * 0.42);
    keyRingMat.color.setHex(S.keyRingSafe > 0.5 ? 0x0FA968 : 0xEF5F18);
    keyRingMat.opacity = S.keyRingAlpha * (0.78 + 0.22 * Math.sin(t * 8.0));
    dryRingMat.opacity = S.dryRingAlpha * (0.70 + 0.25 * Math.sin(t * 7.0));
    speedoNeedlePivot.rotation.z = 0.85; // Dead zero speedometer needle

    // Airbox & Intake Water Suction
    airboxOuterCover.position.x = 0.058 + S.airboxOpen * 0.16;
    airboxOuterCover.visible = S.airboxOpen < 0.75;
    airFoamMat.color.setHex(S.airboxWet > 0.5 ? 0x785B3C : 0xF59E0B);
    airboxRingMat.opacity = S.airboxRingAlpha * (0.78 + 0.22 * Math.sin(t * 9.0));
    intakeHoseMat.opacity = 0.92 - S.airboxOpen * 0.68;
    intakeWaterOrbs.forEach(orb => {
      orb.visible = S.intakeWaterFlow > 0.1;
      const u = (orb.userData.phase + t * 0.75) % 1.0;
      orb.position.copy(intakeCurve.getPointAt(u));
    });

    // Dipstick Pull & CVT Open + Drying Airflow
    dipstickCapPivot.position.y = 0.03 + S.dipstickPull * 0.14;
    dipstickCapPivot.rotation.z = S.dipstickPull * 0.25;
    cvtOuterCover.position.x = 0.035 + S.cvtOpen * 0.18;
    cvtOuterCover.visible = S.cvtOpen < 0.75;
    cvtDryAirGroup.visible = S.cvtDryAlpha > 0.1;
    cvtDryArrows.forEach((a, idx) => {
      const cyc = (t * 1.4 + idx * 0.25) % 1.0;
      a.position.x = 0.34 - cyc * 0.28;
    });
    kickRingMat.opacity = S.kickRingAlpha * (0.75 + 0.25 * Math.sin(t * 9.0));
  }

  // Stage 1 Updates (3D Engine Cutaway: Crank, Piston, Rod Buckle, Spark Plug, Water Eject, Spoon)
  if (engineStageGroup.visible) {
    crankWheelGroup.rotation.z = -S.crankAngle;
    pistonGroup.position.y = S.pistonY;

    // Connecting rod kinematics + dramatic S-buckle during Water Hammer
    const crankTopY = 0.56 + Math.cos(S.crankAngle) * 0.14;
    const crankPinX = Math.sin(S.crankAngle) * 0.14;
    conRodBase.position.set(crankPinX * 0.6, crankTopY, 0.02);
    const totalSpan = Math.max(0.25, S.pistonY - crankTopY);
    const segScale = totalSpan / 0.56;
    rodLowerPivot.scale.y = segScale;
    const bend = S.rodBend;
    rodLowerPivot.rotation.z = bend * 0.68;
    rodMidPivot.rotation.z = -bend * 1.32;
    rodMat.emissiveIntensity = bend * 0.65;

    blockCrackGroup.visible = S.blockCrack > 0.2;
    blockCrackGroup.scale.setScalar(0.85 + 0.25 * S.blockCrack);

    impactShockMat.opacity = S.impactShock * 0.55 * (0.75 + 0.25 * Math.sin(t * 18.0));
    impactShockRing.scale.setScalar(0.85 + S.impactShock * (0.45 + 0.2 * Math.sin(t * 16.0)));
    impactLight.position.set(0, S.pistonY + 0.15, 0.45);
    impactLight.intensity = S.impactShock * 3.5;

    // Chamber Water vs Gas Mist
    const hasWater = S.chamberWater > 0.1;
    chamberWaterMesh.visible = hasWater;
    if (hasWater) {
      const waterTop = 1.90;
      const waterBot = Math.min(1.85, S.pistonY + 0.15);
      const h = Math.max(0.06, (waterTop - waterBot) * S.chamberWater);
      chamberWaterMesh.scale.y = h / 0.36;
      chamberWaterMesh.position.y = waterBot + h * 0.5;
    }

    gasMistGroup.visible = !hasWater;
    if (!hasWater) {
      const topY = 1.90;
      const botY = S.pistonY + 0.16;
      gasParticles.forEach((gp, idx) => {
        gp.position.set(
          gp.userData.nx + Math.sin(t * 4.5 + gp.userData.phase) * 0.02,
          botY + gp.userData.ny * Math.max(0.08, topY - botY),
          gp.userData.nz
        );
      });
    }

    clearancePocketMat.opacity = S.clearanceAlpha * (0.45 + 0.25 * Math.sin(t * 8.0));
    dimBracketGroup.visible = S.clearanceAlpha > 0.1;
    spoonGroup.visible = S.spoonAlpha > 0.1;
    spoonGroup.scale.setScalar(0.5 + 0.5 * S.spoonAlpha);

    // Spark Plug unscrew & water eject (S15A)
    sparkPlugGroup.position.y = 2.15 + S.sparkPlugOff * 0.58;
    sparkPlugGroup.rotation.y = S.sparkPlugOff * Math.PI * 3.0;
    waterEjectGroup.visible = S.waterEject > 0.1;
    ejectDrops.forEach(dr => {
      const u = (dr.userData.phase + t * 1.45) % 1.0;
      dr.position.set(dr.userData.vx * u * 1.8, u * 0.95 - u * u * 0.35, dr.userData.vz * u);
      dr.scale.setScalar(Math.max(0.01, (1 - u * 0.6) * S.waterEject));
    });
  }

  // Stage 2 Updates (Split-View Physics Gas vs Water)
  if (splitPhysicsGroup.visible) {
    const compWave = 0.5 - 0.5 * Math.cos(t * 3.8);
    // Left cylinder: gas compresses smoothly all the way to top (+0.48)
    const pGasY = -0.18 + compWave * 0.62;
    splitGas.pist.position.y = pGasY;
    splitGas.mist.forEach(m => {
      const top = 0.55, bot = pGasY + 0.11;
      m.position.set(m.userData.nx, bot + m.userData.ny * Math.max(0.06, top - bot), m.userData.nz);
    });
    // Right cylinder: piston hits solid water at +0.04 and stalls/rebounds!
    const pWaterY = -0.18 + Math.min(0.22, compWave * 0.55);
    splitWater.pist.position.y = pWaterY;
    splitWater.bounceArr.scale.setScalar(0.85 + 0.22 * Math.sin(t * 10.0));
  }

  // Stage 3 Updates (Oil Comparison Tubes)
  if (oilCompareGroup.visible) {
    oilTubeNormal.rotation.y = Math.sin(t * 1.4) * 0.18;
    oilTubeCoffee.rotation.y = -Math.sin(t * 1.4) * 0.18;
  }

  // Mas Raka Pose Rigging
  const moodNames = ['alert', 'panic', 'focused', 'smile'];
  const curMood = isOutroStage ? 'smile' : (moodNames[Math.round(S.rakaMood)] || 'alert');
  const blinkCycle = ((t + 0.85) % 3.4);
  const isBlinking = curMood !== 'panic' && (blinkCycle > 3.18 && blinkCycle < 3.32);
  updateRakaFace(curMood, isBlinking);

  const breath = Math.sin(t * 3.2) * 0.008;
  const pose = isOutroStage ? 4 : Math.round(S.rakaPose);
  if (pose === 4) {
    // Outro Bust Centered inside Circle Badge
    RAKA.root.position.set(0, 0.42 + S.outroLiftY + breath, 0);
    RAKA.root.rotation.set(0, 0, 0);
    RAKA.bodyPivot.position.set(0, 0.72, 0);
    RAKA.bodyPivot.rotation.set(0, 0, 0);
    RAKA.legL.rotation.set(0, 0, 0); RAKA.legR.rotation.set(0, 0, 0);
    RAKA.armL.root.rotation.set(-0.25, 0, -0.14); RAKA.armL.forearmPivot.rotation.set(0, 0, 0);
    RAKA.armR.root.rotation.set(-0.30, 0, -2.25 - Math.sin(t * 7.5) * 0.10); RAKA.armR.forearmPivot.rotation.set(-0.22, 0, -0.18);
    RAKA.headPivot.rotation.set(Math.sin(S.outroNod * Math.PI) * 0.16, Math.sin(t * 2.2) * 0.04, S.outroHeadTilt);
  } else if (pose === 1) {
    // S13B Pushing Scooter onto Dry Sidewalk with Procedural Walk-Cycle!
    const walkPhase = t * 8.5;
    const bounce = Math.abs(Math.sin(walkPhase)) * 0.055;
    RAKA.root.position.set(S.mioX - 0.82, S.mioY + bounce, S.mioZ - 0.15);
    RAKA.root.rotation.set(0, S.mioYaw + 0.25, 0);
    RAKA.bodyPivot.position.set(0, 0.72, 0);
    RAKA.bodyPivot.rotation.set(0.18, 0, Math.sin(walkPhase) * 0.04);
    RAKA.legL.rotation.set(Math.sin(walkPhase) * 0.55, 0, 0);
    RAKA.legR.rotation.set(-Math.sin(walkPhase) * 0.55, 0, 0);
    RAKA.armL.root.rotation.set(-0.92, -0.35, -0.18); RAKA.armL.forearmPivot.rotation.set(-0.35, 0, 0);
    RAKA.armR.root.rotation.set(-0.92, -0.15, 0.12);  RAKA.armR.forearmPivot.rotation.set(-0.35, 0, 0);
    RAKA.headPivot.rotation.set(0.10, -0.20, 0);
  } else if (pose === 2) {
    // S14A Crouching Beside Parked Scooter Inspecting Dipstick & Airbox
    RAKA.root.position.set(S.mioX - 0.92, S.mioY - 0.16 + breath, S.mioZ - 0.92);
    RAKA.root.rotation.set(0, 0.52, 0);
    RAKA.bodyPivot.position.set(0, 0.52, 0);
    RAKA.bodyPivot.rotation.set(0.28, 0, 0);
    RAKA.legL.rotation.set(-1.15, 0, 0); RAKA.legR.rotation.set(-1.15, 0, 0);
    RAKA.armR.root.rotation.set(-0.95, 0.22, 0.15); RAKA.armR.forearmPivot.rotation.set(-0.45, 0, 0);
    RAKA.armL.root.rotation.set(-0.65, -0.15, -0.18); RAKA.armL.forearmPivot.rotation.set(-0.55, 0, 0);
    RAKA.headPivot.rotation.set(0.18, 0.15, 0);
  } else if (pose === 3) {
    // Standing Calmly Beside Scooter (S12, S15B, S17, S18)
    RAKA.root.position.set(S.mioX - 0.95, S.mioY + breath, S.mioZ - 0.10);
    RAKA.root.rotation.set(0, -0.18, 0);
    RAKA.bodyPivot.position.set(0, 0.72, 0);
    RAKA.bodyPivot.rotation.set(0, 0, 0);
    RAKA.legL.rotation.set(0, 0, 0); RAKA.legR.rotation.set(0, 0, 0);
    RAKA.armL.root.rotation.set(-0.28, 0, -0.16); RAKA.armL.forearmPivot.rotation.set(-0.32, 0, 0);
    if (S.rakaWave > 0.5) {
      RAKA.armR.root.rotation.set(-0.32, 0, -2.08 - Math.sin(t * 5.8) * 0.10);
      RAKA.armR.forearmPivot.rotation.set(-0.24, 0, -0.18);
    } else {
      RAKA.armR.root.rotation.set(-0.42, 0.18, 0.18);
      RAKA.armR.forearmPivot.rotation.set(-0.48, 0, 0);
    }
    RAKA.headPivot.rotation.set(S.rakaHeadPitch, S.rakaHeadYaw, S.rakaHeadRoll);
  } else {
    // Seated Riding Mio in Floodwater (S01, S03, S04, S05, S13A, S16A)
    const tenseJitter = (curMood === 'panic') ? Math.sin(t * 28.0) * 0.005 : 0;
    RAKA.root.position.set(S.mioX + tenseJitter, S.mioY + 0.61 + breath, S.mioZ - 0.66);
    RAKA.root.rotation.set(0, S.mioYaw, 0);
    RAKA.bodyPivot.position.set(0, 0.68, 0);
    RAKA.bodyPivot.rotation.set(0.18, 0, 0);
    RAKA.legL.rotation.set(-1.12, 0.12, 0); RAKA.legR.rotation.set(-1.12, -0.12, 0);
    RAKA.armR.root.rotation.set(-0.88 + S.starterPress * 0.08, -0.08, 0.18);
    RAKA.armR.forearmPivot.rotation.set(-0.56, -0.06, -0.14);
    RAKA.armR.handPivot.rotation.set(S.starterPress * 0.18 - 0.12, 0.15, -0.25);
    RAKA.armL.root.rotation.set(-0.88, 0.08, -0.18);
    RAKA.armL.forearmPivot.rotation.set(-0.56, 0.06, 0.14);
    RAKA.armL.handPivot.rotation.set(-0.12, -0.15, 0.25);
    RAKA.headPivot.rotation.set(S.rakaHeadPitch, S.rakaHeadYaw, S.rakaHeadRoll);
  }

  // Dynamic 3D Callout Target Anchors
  let c1T = new THREE.Vector3(), c1Ox = 165, c1Oy = -140;
  let c2T = new THREE.Vector3(), c2Ox = 165, c2Oy = -140;
  let c3T = new THREE.Vector3(), c3Ox = 165, c3Oy = -140;
  let c4T = getWorldAnchor(sparkPlugGroup, new THREE.Vector3(0, 0.1, 0));

  if (t < 10.85) {
    c1T = getWorldAnchor(rodMidPivot); c1Ox = 185; c1Oy = -130;
  } else if (t < 16.52) {
    c1T = getWorldAnchor(starterBtnMesh); c1Ox = -165; c1Oy = -145;
  } else if (t < 26.20) {
    c1T = getWorldAnchor(airboxGroup); c1Ox = -170; c1Oy = -150;
  } else if (t < 33.08) {
    c3T = getWorldAnchor(pistonGroup, new THREE.Vector3(0, 0.22, 0)); c3Ox = -175; c3Oy = -140;
  } else if (t < 37.24) {
    c1T = getWorldAnchor(clearancePocket); c1Ox = 140; c1Oy = -125;
  } else if (t < 39.32) {
    c1T = getWorldAnchor(spoonBowl); c1Ox = -70; c1Oy = -150;
  } else if (t < 44.32) {
    c3T = getWorldAnchor(splitGas.pist, new THREE.Vector3(0, 0.25, 0)); c3Ox = -20; c3Oy = -165;
    c2T = getWorldAnchor(splitWater.bounceArr); c2Ox = 20; c2Oy = -165;
  } else if (t < 55.28) {
    c1T = getWorldAnchor(rodMidPivot); c1Ox = 185; c1Oy = -125;
  } else if (t < 62.50) {
    c1T = getWorldAnchor(starterBtnMesh); c1Ox = -155; c1Oy = -145;
  } else if (t < 65.10) {
    c3T = getWorldAnchor(drySafeRing); c3Ox = -120; c3Oy = -155;
  } else if (t < 67.80) {
    c3T = getWorldAnchor(dipstickCapPivot); c3Ox = -140; c3Oy = -140;
  } else if (t < 72.70) {
    c3T = getWorldAnchor(oilTubeNormal, new THREE.Vector3(0, 0.45, 0)); c3Ox = 40; c3Oy = -135;
    c1T = getWorldAnchor(oilTubeCoffee, new THREE.Vector3(0, 0.45, 0)); c1Ox = -40; c1Oy = -135;
  } else if (t < 75.90) {
    c4T = getWorldAnchor(waterEjectGroup, new THREE.Vector3(0, 0.25, 0));
  } else if (t < 79.50) {
    c3T = getWorldAnchor(cvtGroup); c3Ox = 165; c3Oy = -145;
  } else {
    c1T = getWorldAnchor(rodMidPivot); c1Ox = 185; c1Oy = -125;
  }

  setCalloutLine('#line-c1', '#dot-c1', $('#call1'), c1T, c1Ox, c1Oy, S.c1Alpha);
  setCalloutLine('#line-c2', '#dot-c2', $('#call2'), c2T, c2Ox, c2Oy, S.c2Alpha);
  setCalloutLine('#line-c3', '#dot-c3', $('#call3'), c3T, c3Ox, c3Oy, S.c3Alpha);
  setCalloutLine('#line-c4', '#dot-c4', $('#call4'), c4T, 145, -75, S.c4Alpha);

  renderer.render(scene, camera);
}

/* ============ 9. FIT, PLAYBACK & DETERMINISTIC CAPTURE HOOKS ============ */
const stage = $('#stage');
const fit = () => {
  const s = Math.min(innerWidth / W, innerHeight / H);
  stage.style.transform = `translate(-50%,-50%) scale(${s})`;
};
addEventListener('resize', fit);
fit();

const audioEl = $('#vo-audio');
let isPlaying = false;
const isDeterministicCapture = Q.has('clean') || Q.has('capture');

if (!isDeterministicCapture) {
  (function frame() {
    if (!window.THUMB_LOCK) {
      if (isPlaying && !audioEl.paused) {
        tl.time(audioEl.currentTime, false);
      }
      render(tl.time());
    }
    requestAnimationFrame(frame);
  })();
}

$('#btn-play').onclick = () => {
  if (audioEl.paused) {
    isPlaying = true;
    audioEl.play();
    tl.play(audioEl.currentTime);
    $('#btn-play').textContent = '⏸ Pause';
  } else {
    isPlaying = false;
    audioEl.pause();
    tl.pause();
    $('#btn-play').textContent = '▶ Play Master';
  }
};

document.querySelectorAll('#switcher button[data-t]').forEach(btn => {
  btn.onclick = () => {
    const t = parseFloat(btn.dataset.t);
    isPlaying = false;
    audioEl.pause();
    audioEl.currentTime = t;
    tl.pause(t);
    render(t);
    $('#btn-play').textContent = '▶ Play Master';
  };
});

const seek = (t) => {
  document.body.classList.add('clean-snap');
  isPlaying = false;
  tl.pause();
  tl.time(t, false);
  if (gsap.ticker.tick) gsap.ticker.tick();
  render(t);
  const gl = renderer.getContext();
  if (gl && gl.finish) gl.finish();
  return new Promise((resolve) => {
    requestAnimationFrame(() => {
      requestAnimationFrame(() => resolve(true));
    });
  });
};

window.OPENER = {
  tl, DURATION, W, H, seek, S, render, RAKA, renderer, scene, camera,
  floodRoadGroup, engineStageGroup, splitPhysicsGroup, oilCompareGroup,
  ready: false
};

const avatarImg = $('#outro-avatar-img');
const avatarReady = avatarImg && avatarImg.decode ? avatarImg.decode().catch(() => {}) : Promise.resolve();
Promise.all([document.fonts.ready, avatarReady]).then(() => {
  window.OPENER.ready = true;
  if (!Q.has('clean')) render(0);
});
</script>
</body>
