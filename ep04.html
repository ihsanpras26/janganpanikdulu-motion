/* ===== LOCKED BRAND IDENTITY (OPSI 2): Crisp White (#FFFFFF) x Deep Indigo (#261A66) x Solid Orange (#EF5F18) ===== */

  --sub-bg:#FFFFFF; --sub-ink:#261A66; --sub-border:#261A66;

*{margin:0;padding:0;box-sizing:border-box}
html,body{

  font-family:"Plus Jakarta Sans",system-ui,sans-serif;

}
#stage.xray-bg{
  background:linear-gradient(180deg,#E2ECF8 0%,#F4F8FD 52%,#E6EEF7 100%);
}
#stage.safe-bg{

}
#gl{position:absolute;inset:0;width:1080px;height:1920px;display:block;z-index:1}
#OverlaySVG{position:absolute;inset:0;width:1080px;height:1920px;pointer-events:none;z-index:4}
#OverlaySVG line{stroke-width:3.5;stroke-linecap:round}
#line-c1,#line-c2{stroke:var(--danger)}
#dot-c1,#dot-c2{fill:var(--danger);stroke:#FFFFFF;stroke-width:3}

#hud{position:absolute;inset:0;pointer-events:none;z-index:6}

.scrim-top{

.scrim-bottom{

/* ZONA 2A: HOOK LOCKUP */

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from './vendor/RoundedBoxGeometry.js';

const $ = s => document.querySelector(s);
const Q = new URLSearchParams(location.search);
if (Q.has('clean') || Q.has('capture')) document.body.classList.add('clean-snap');

/* ============ 1. RENDERER & LIGHTING ============ */
const W = 1080, H = 1920;
const renderer = new THREE.WebGLRenderer({
  canvas: $('#gl'),
  antialias: true,
  alpha: true,
  logarithmicDepthBuffer: true,
  preserveDrawingBuffer: true
});
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(24, W / H, 0.15, 180);

const hemi = new THREE.HemisphereLight(0xFFFDF9, 0xCBD5E1, 1.75);
hemi.position.set(0, 20, 0);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xFFF7EA, 2.30);
sun.position.set(7.5, 14.0, 9.5);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
const sd = 7.5;
sun.shadow.camera.left = -sd;
sun.shadow.camera.right = sd;
sun.shadow.camera.top = sd;
sun.shadow.camera.bottom = -sd;
sun.shadow.bias = -0.0005;
scene.add(sun);

const rim = new THREE.DirectionalLight(0x90E0EF, 0.90);
rim.position.set(-8, 7, -6);
scene.add(rim);

const heroAccentLight = new THREE.PointLight(0xFFFFFF, 1.4, 8.0);
heroAccentLight.position.set(0, 1.8, 3.2);
scene.add(heroAccentLight);

const mat = (hex, rough = 0.42, metal = 0.05, emissive = 0x000000, emInt = 0) =>
  new THREE.MeshStandardMaterial({ color: hex, roughness: rough, metalness: metal, emissive, emissiveIntensity: emInt });

const outlineMat = new THREE.MeshBasicMaterial({ color: 0x181E26, side: THREE.BackSide });
function withOutline(mesh, scale = 1.055) {
  const out = new THREE.Mesh(mesh.geometry, outlineMat);
  out.scale.setScalar(scale);
  mesh.add(out);
  return mesh;
}

function makeBadgeCanvasTex(text, bgHex = '#EF5F18', fgHex = '#FFFFFF', subText = '') {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = bgHex;
  ctx.beginPath();
  ctx.roundRect(12, 12, 488, 232, 44);
  ctx.fill();
  ctx.lineWidth = 10;
  ctx.strokeStyle = '#FFFFFF';
  ctx.stroke();
  ctx.fillStyle = fgHex;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = subText ? '800 72px "Plus Jakarta Sans",sans-serif' : '800 92px "Plus Jakarta Sans",sans-serif';
  ctx.fillText(text, 256, subText ? 105 : 128);
  if (subText) {
    ctx.font = '700 42px "Plus Jakarta Sans",sans-serif';
    ctx.fillText(subText, 256, 182);
  }
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeCrossMark3D(color = 0xDC2626, size = 0.32) {
  const g = new THREE.Group();
  const m = new THREE.MeshBasicMaterial({ color });
  [-Math.PI / 4, Math.PI / 4].forEach(ang => {

function makeViperSkinTex() {
  const c = document.createElement('canvas');
  c.width = 512; c.height = 1024;
  const ctx = c.getContext('2d');

  // Deep forest-slate dorsal base
  ctx.fillStyle = '#1D2B28';
  ctx.fillRect(0, 0, 512, 1024);

  // Subtle overlapping reptile hex/diamond scales across dorsal & flanks
  const rows = 44, cols = 22;
  const cw = 512 / cols, ch = 1024 / rows;
  for (let r = 0; r < rows; r++) {
    const off = (r % 2) * (cw * 0.5);
    for (let col = -1; col <= cols; col++) {
      const cx = col * cw + off;
      const cy = r * ch;
      ctx.fillStyle = (r + col) % 2 === 0 ? '#243632' : '#192623';
      ctx.beginPath();
      ctx.moveTo(cx, cy - ch * 0.52);
      ctx.lineTo(cx + cw * 0.52, cy);
      ctx.lineTo(cx, cy + ch * 0.52);
      ctx.lineTo(cx - cw * 0.52, cy);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = 'rgba(10, 15, 20, 0.55)';
      ctx.lineWidth = 2.0;
      ctx.stroke();
    }
  }

  // Signal Orange + Gold-Amber Viper Diamond Dorsal Saddles centered along spine seam (x=0 & x=512 -> dorsal u=0/1!)
  for (let y = 64; y < 1024; y += 128) {
    [0, 512].forEach(sx => {
      ctx.fillStyle = '#F59E0B';
      ctx.beginPath();
      ctx.moveTo(sx, y - 48);
      ctx.lineTo(sx + 84, y);
      ctx.lineTo(sx, y + 48);
      ctx.lineTo(sx - 84, y);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#EF5F18';
      ctx.beginPath();
      ctx.moveTo(sx, y - 38);
      ctx.lineTo(sx + 68, y);
      ctx.lineTo(sx, y + 38);
      ctx.lineTo(sx - 68, y);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = '#181E26';
      ctx.beginPath();
      ctx.moveTo(sx, y - 16);
      ctx.lineTo(sx + 26, y);
      ctx.lineTo(sx, y + 16);
      ctx.lineTo(sx - 26, y);
      ctx.closePath();
      ctx.fill();
    });
  }

  // Pale Warm Cream Ventral Belly Scutes centered along underside (x = 256 -> u = 0.5!)
  const bellyGrad = ctx.createLinearGradient(156, 0, 356, 0);
  bellyGrad.addColorStop(0.0, 'rgba(254, 243, 199, 0)');
  bellyGrad.addColorStop(0.16, '#FDE68A');
  bellyGrad.addColorStop(0.50, '#FEF3C7');
  bellyGrad.addColorStop(0.84, '#FDE68A');
  bellyGrad.addColorStop(1.0, 'rgba(254, 243, 199, 0)');
  ctx.fillStyle = bellyGrad;
  ctx.fillRect(156, 0, 200, 1024);

  // Horizontal ribbed belly plate seams
  ctx.strokeStyle = 'rgba(180, 110, 40, 0.45)';
  ctx.lineWidth = 3;
  for (let y = 0; y < 1024; y += 22) {
    ctx.beginPath();
    ctx.moveTo(176, y);
    ctx.quadraticCurveTo(256, y + 5, 336, y);
    ctx.stroke();
  }

  const tex = new THREE.CanvasTexture(c);
  tex.wrapS = THREE.RepeatWrapping;
  tex.wrapT = THREE.RepeatWrapping;
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function buildTaperedViperBodyGeo(curve, tubularSegs = 68, radialSegs = 20) {
  const geo = new THREE.BufferGeometry();
  const positions = [], normals = [], uvs = [], indices = [];
  const upHint = new THREE.Vector3(0, 1, 0);

  for (let i = 0; i <= tubularSegs; i++) {
    const u = i / tubularSegs;
    const pt = curve.getPointAt(u);
    const tangent = curve.getTangentAt(u).normalize();
    const binormal = new THREE.Vector3().crossVectors(tangent, upHint);
    if (binormal.lengthSq() < 1e-5) binormal.set(1, 0, 0);
    binormal.normalize();
    const normal = new THREE.Vector3().crossVectors(binormal, tangent).normalize();

    let taper;
    if (u < 0.16) taper = 0.08 + Math.pow(u / 0.16, 0.72) * 0.80;
    else if (u < 0.72) taper = 0.88 + Math.sin(((u - 0.16) / 0.56) * Math.PI) * 0.24;
    else taper = 0.88 - ((u - 0.72) / 0.28) * 0.24;
    const r = 0.068 * taper;

    for (let j = 0; j <= radialSegs; j++) {
      const phi = (j / radialSegs) * Math.PI * 2;
      const cosP = Math.cos(phi);
      const sinP = Math.sin(phi);
      const nx = normal.x * cosP * 0.88 + binormal.x * sinP * 1.12;
      const ny = normal.y * cosP * 0.88 + binormal.y * sinP * 1.12;
      const nz = normal.z * cosP * 0.88 + binormal.z * sinP * 1.12;

      positions.push(pt.x + nx * r, pt.y + ny * r, pt.z + nz * r);
      const nVec = new THREE.Vector3(nx, ny, nz).normalize();
      normals.push(nVec.x, nVec.y, nVec.z);
      uvs.push(j / radialSegs, u * 4.2);
    }
  }

  for (let i = 0; i < tubularSegs; i++) {
    for (let j = 0; j < radialSegs; j++) {
      const a = i * (radialSegs + 1) + j;
      const b = (i + 1) * (radialSegs + 1) + j;
      const c = (i + 1) * (radialSegs + 1) + (j + 1);
      const d = i * (radialSegs + 1) + (j + 1);
      // CCW outward winding so FrontSide shows viperSkinTex and BackSide stays strictly the outer ink outline!
      indices.push(a, d, b, b, d, c);
    }
  }

  geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
  geo.setIndex(indices);
  return geo;
}

function updateRakaFace(mood = 'alert', isBlinking = false) {
  const key = `${mood}_${isBlinking ? 1 : 0}`;
  if (key === lastFaceKey) return;
  lastFaceKey = key;

  const ctx = faceCtx;
  ctx.clearRect(0, 0, 512, 512);
  ctx.fillStyle = '#181E26';
  ctx.strokeStyle = '#181E26';
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // Eyebrows
  ctx.lineWidth = 20;
  ctx.beginPath();
  if (mood === 'pain') {
    ctx.moveTo(106, 148); ctx.lineTo(208, 192);
    ctx.moveTo(406, 148); ctx.lineTo(304, 192);
  } else if (mood === 'panic') {
    ctx.moveTo(108, 182); ctx.quadraticCurveTo(156, 145, 206, 152);
    ctx.moveTo(306, 152); ctx.quadraticCurveTo(356, 145, 404, 182);
  } else if (mood === 'focused') {
    ctx.moveTo(110, 162); ctx.quadraticCurveTo(158, 158, 208, 176);
    ctx.moveTo(304, 176); ctx.quadraticCurveTo(354, 158, 402, 162);
  } else if (mood === 'smile') {
    ctx.moveTo(112, 174); ctx.quadraticCurveTo(156, 156, 204, 170);
    ctx.moveTo(308, 170); ctx.quadraticCurveTo(356, 156, 400, 174);
  } else {
    ctx.moveTo(110, 168); ctx.quadraticCurveTo(156, 146, 204, 164);
    ctx.moveTo(308, 164); ctx.quadraticCurveTo(356, 146, 402, 168);
  }
  ctx.stroke();

  // Eyes
  [158, 354].forEach((cx, idx) => {
    if (mood === 'pain') {
      // Tightly winced > < pain eyes
      ctx.lineWidth = 18;
      ctx.beginPath();
      if (idx === 0) {
        ctx.moveTo(cx - 28, 224); ctx.lineTo(cx + 22, 250); ctx.lineTo(cx - 28, 276);
      } else {
        ctx.moveTo(cx + 28, 224); ctx.lineTo(cx - 22, 250); ctx.lineTo(cx + 28, 276);
      }
      ctx.stroke();
    } else if (isBlinking) {
      ctx.lineWidth = 16;
      ctx.beginPath();
      ctx.moveTo(cx - 24, 252);
      ctx.quadraticCurveTo(cx, 260, cx + 24, 252);
      ctx.stroke();
    } else {
      const eyeH = mood === 'panic' ? 64 : 56;
      const eyeW = mood === 'panic' ? 48 : 44;
      ctx.fillStyle = '#181E26';
      ctx.beginPath();
      ctx.roundRect(cx - eyeW / 2, 222, eyeW, eyeH, 21);
      ctx.fill();
      ctx.fillStyle = '#FFFFFF';
      ctx.beginPath();
      ctx.arc(cx - 7, 240, mood === 'panic' ? 10.5 : 9, 0, Math.PI * 2);
      ctx.fill();
    }
  });

  // Sweat drop on temple for pain/panic
  if (mood === 'pain' || mood === 'panic') {
    ctx.fillStyle = '#38BDF8';
    ctx.beginPath();
    ctx.moveTo(432, 195);
    ctx.quadraticCurveTo(452, 232, 432, 246);
    ctx.quadraticCurveTo(412, 232, 432, 195);
    ctx.fill();
    ctx.strokeStyle = '#261A66'; ctx.lineWidth = 5; ctx.stroke();
  }

  ctx.strokeStyle = 'rgba(145, 92, 58, 0.78)';
  ctx.lineWidth = 10;
  ctx.beginPath();
  ctx.moveTo(256, 238); ctx.lineTo(248, 288); ctx.lineTo(268, 292);
  ctx.stroke();

  ctx.strokeStyle = '#181E26';
  ctx.fillStyle = '#181E26';
  ctx.lineWidth = 14;
  ctx.beginPath();
  if (mood === 'pain') {
    // Clenched wavy grimace mouth
    ctx.fillStyle = '#FFFFFF';
    ctx.strokeStyle = '#181E26';
    ctx.lineWidth = 13;
    ctx.beginPath();
    ctx.roundRect(198, 330, 116, 44, 18);
    ctx.fill();
    ctx.stroke();
    ctx.lineWidth = 8;
    ctx.beginPath();
    ctx.moveTo(208, 352);
    ctx.bezierCurveTo(232, 342, 280, 362, 304, 350);
    ctx.stroke();
  } else if (mood === 'panic') {
    ctx.roundRect(228, 328, 56, 42, 20);
    ctx.fill();
  } else if (mood === 'alert') {
    ctx.moveTo(214, 352); ctx.quadraticCurveTo(256, 336, 298, 352); ctx.stroke();
  } else if (mood === 'focused') {
    ctx.moveTo(212, 346); ctx.quadraticCurveTo(256, 352, 302, 342); ctx.stroke();
  } else {
    ctx.moveTo(204, 344); ctx.quadraticCurveTo(258, 376, 312, 334); ctx.stroke();
  }
  faceTexture.needsUpdate = true;
}

/* ============ 8. HUD, SUBTITLES & 3D CALLOUT ANCHORS ============ */
function easeOutBack(x) { const c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2); }
function easeInQuad(x) { return x * x; }
function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }

function getWindowMotion(t, tIn, tOut, enterDur = 0.32, exitDur = 0.24) {
  if (t < tIn || t > tOut) return { alpha: 0, y: -22, scale: 0.90 };
  if (t - tIn < enterDur) {
    const p = Math.max(0, Math.min(1, (t - tIn) / enterDur));
    const eb = easeOutBack(p);
    return { alpha: Math.min(1, p * 1.35), y: (1 - eb) * -22, scale: 0.88 + 0.12 * eb };
  }
  if (tOut - t < exitDur) {
    const p = Math.max(0, Math.min(1, (tOut - t) / exitDur));
    const eq = 1 - easeInQuad(1 - p);
    return { alpha: eq, y: (1 - eq) * -18, scale: 0.94 + 0.06 * eq };
  }
  return { alpha: 1, y: 0, scale: 1 };
}

CAPTION_CHUNKS.forEach(ch => {
  if (ch.customTimes) { ch.wordTimes = ch.customTimes; return; }
  const weights = ch.words.map(w => Math.max(2, w.replace(/[^a-zA-Z0-9]/g, '').length));
  const totalW = weights.reduce((a, b) => a + b, 0);
  const span = (ch.e - ch.s) * 0.94;
  let cursor = ch.s + 0.02;
  ch.wordTimes = ch.words.map((w, idx) => {
    const dur = (weights[idx] / totalW) * span;
    const wt = { word: w, ws: cursor, we: cursor + dur };
    cursor += dur;
    return wt;
  });
});

function setCalloutLine(lineId, dotId, callEl, worldTarget, offsetX, offsetY, alpha) {
  const line = $(lineId), dot = $(dotId);
  if (alpha <= 0.01) {
    callEl.style.opacity = '0';
    line.setAttribute('opacity', '0');
    dot.setAttribute('opacity', '0');
    return;
  }
  const v = worldTarget.clone().project(camera);
  const px = (v.x * 0.5 + 0.5) * W;
  const py = (-v.y * 0.5 + 0.5) * H;
  const cx = Math.max(240, Math.min(840, px + offsetX));
  const cy = Math.max(360, Math.min(1240, py + offsetY));

  const lineProg = easeOutCubic(Math.min(1, alpha * 1.35));
  const badgeProg = easeOutBack(Math.max(0, Math.min(1, (alpha - 0.18) / 0.82)));
  const badgeAlpha = Math.max(0, Math.min(1, (alpha - 0.15) / 0.65));

  line.setAttribute('x1', px.toFixed(1));
  line.setAttribute('y1', py.toFixed(1));
  line.setAttribute('x2', (px + (cx - px) * lineProg).toFixed(1));
  line.setAttribute('y2', (py + (cy - py) * lineProg).toFixed(1));
  line.setAttribute('opacity', Math.min(1, alpha * 1.4).toFixed(2));

  dot.setAttribute('cx', px.toFixed(1));
  dot.setAttribute('cy', py.toFixed(1));
  dot.setAttribute('r', (7 * Math.min(1.12, easeOutBack(Math.min(1, alpha * 1.5)))).toFixed(1));
  dot.setAttribute('opacity', Math.min(1, alpha * 1.5).toFixed(2));

  callEl.style.left = `${cx}px`;
  callEl.style.top = `${cy}px`;
  callEl.style.opacity = badgeAlpha.toFixed(2);
  const sc = (0.85 + 0.15 * badgeProg).toFixed(3);
  const ty = ((1 - badgeProg) * 12).toFixed(1);
  callEl.style.transform = `translate(-50%, calc(-50% + ${ty}px)) scale(${sc})`;
}

function updateHUD(t) {

  const pillBox = $('#step-pill-box'), badgeEl = $('#tr-badge'), titleEl = $('#tr-title');

  const segs = [$('#seg1'), $('#seg2'), $('#seg3'), $('#seg4')];

  const seg = TOP_SEGMENTS.find(x => t >= x.s && t <= x.e);
  if (!seg) {
    hook.style.opacity = '0';
    tracker.style.opacity = '0';
  } else if (seg.type === 'hook') {
    const m = getWindowMotion(t, seg.s, seg.e, 0.36, 0.26);
    tracker.style.opacity = '0';
    hook.style.opacity = m.alpha.toFixed(3);
    hook.style.transform = `translate3d(0, ${m.y.toFixed(1)}px, 0) scale(${m.scale.toFixed(3)})`;
    hookTitle.textContent = seg.hTitle;
    hookPill.textContent = seg.hPill;
  } else {
    const m = getWindowMotion(t, seg.s, seg.e, 0.32, 0.22);
    hook.style.opacity = '0';
    tracker.style.opacity = m.alpha.toFixed(3);
    tracker.style.transform = `translate3d(0, ${m.y.toFixed(1)}px, 0) scale(${m.scale.toFixed(3)})`;
    if (seg.badge) {
      badgeEl.style.display = 'flex';
      badgeEl.textContent = seg.badge;
      pillBox.classList.remove('text-only');
    } else {
      badgeEl.style.display = 'none';
      pillBox.classList.add('text-only');
    }
    titleEl.textContent = seg.title;
    progWrap.style.display = seg.showDots ? 'flex' : 'none';
    if (seg.showDots) segs.forEach((el, i) => el.classList.toggle('on', i < seg.prog));
  }

  // Callout copy per scene
  if (t < 6.80) $('#call1-text').textContent = 'risiko diamputasi!';
  else if (t < 11.90) $('#call1-text').textContent = 'ikat kencang = tahan darah?';
  else if (t < 17.50) $('#call2-text').textContent = 'bukan lewat pembuluh darah!';
  else if (t < 20.85) $('#call1-text').textContent = 'jalur utama racun';
  else if (t < 23.60) $('#call1-text').textContent = 'darah = dipompa jantung';
  else if (t < 26.35) $('#call2-text').textContent = 'diam saat kaki tenang';
  else if (t < 28.65) $('#call1-text').textContent = 'panik & dipakai lari';
  else if (t < 31.85) $('#call1-text').textContent = 'racun terpompa naik!';
  else if (t < 37.10) $('#call1-text').textContent = 'darah & oksigen terputus';
  else if (t < 40.35) $('#call1-text').textContent = 'jaringan mati (nekrosis)';
  else if (t < 46.80) $('#call2-text').textContent = 'bakteri mulut -> infeksi luka';
  else if (t < 52.80) $('#call3-text').textContent = 'otot rileks = racun tertahan';
  else if (t < 58.30) $('#call3-text').textContent = 'cegah kulit terjepit saat bengkak';
  else if (t < 63.05) $('#call4-text').textContent = 'kunci sendi tetap lurus';
  else if (t < 66.00) $('#call3-text').textContent = 'foto dari jarak aman';
  else if (t < 67.85) $('#call3-text').textContent = 'evakuasi ambulans tanpa jalan!';
  else if (t < 69.95) $('#call3-text').textContent = 'segera dapat serum antibisa!';
  else $('#call1-text').textContent = 'gerak panik = pompa racun';

  // Verbatim Karaoke Subtitle Bar
  let activeChunk = CAPTION_CHUNKS.find(c => t >= c.s && t <= c.e);
  let gapAlpha = 1;
  if (!activeChunk) {
    activeChunk = CAPTION_CHUNKS.reduce((best, cur) => {
      const dist = Math.min(Math.abs(t - cur.s), Math.abs(t - cur.e));
      const bestDist = Math.min(Math.abs(t - best.s), Math.abs(t - best.e));
      return dist < bestDist ? cur : best;
    }, CAPTION_CHUNKS[0]);
    const minDist = Math.min(Math.abs(t - activeChunk.s), Math.abs(t - activeChunk.e));
    if (minDist > 0.14) gapAlpha = Math.max(0, 1 - (minDist - 0.14) / 0.18);
  }

  const dtChunk = Math.max(0, t - activeChunk.s);
  const popEase = easeOutBack(Math.min(1, dtChunk / 0.16));
  subCard.style.opacity = gapAlpha.toFixed(3);
  subCard.style.transform = `translate3d(0, ${((1 - popEase) * 8 + (1 - gapAlpha) * 8).toFixed(1)}px, 0) scale(${(0.97 + 0.03 * popEase).toFixed(3)})`;

  let activeIdx = 0;
  for (let i = 0; i < activeChunk.wordTimes.length; i++) {
    if (t >= activeChunk.wordTimes[i].ws) activeIdx = i;
  }
  subCard.innerHTML = activeChunk.wordTimes.map((wt, idx) => {
    const cls = idx < activeIdx ? 'w past' : (idx === activeIdx ? 'w active' : 'w future');
    return `<span class="${cls}">${wt.word}</span>`;
  }).join(' ');
}

function getWorldAnchor(obj, localVec = new THREE.Vector3()) {

      } else {
        // S14-S15 & S22: Venom already settled deep below suction depth
        vo.mesh.position.set(0.08 + ((idx % 5) - 2) * 0.09, 1.18 + Math.floor(idx / 5) * 0.14 + Math.sin(t * 2.5 + idx) * 0.012, 0.12);
      }
    });

    // Suction Cup (X) & Oral Bacteria (S14-S15, S22)
    suctionGroup.visible = S.suctionAlpha > 0.1;
    suctionGroup.position.y = 2.34 + Math.sin(t * 5.0) * 0.04;
    bacteriaOrbs.forEach((bo, idx) => {
      bo.mesh.visible = S.bacteriaAlpha > 0.1;
      const u = (bo.phase + t * 0.55) % 1.0;
      bo.mesh.position.set(0.28 + bo.xOff + Math.sin(t * 6 + idx) * 0.02, 2.35 - u * 0.45, 0.14);
    });
    infectionGlow.material.opacity = S.bacteriaAlpha * (0.28 + 0.14 * Math.sin(t * 9.0));
  }

  // Split 3D Comparison (S23)
  if (splitCompareGroup.visible) {
    const sqL = 0.5 + 0.5 * Math.sin(t * 10.0);
    slMuscL.position.x = -0.14 + sqL * 0.045;
    slMuscR.position.x = 0.14 - sqL * 0.045;
    slOrbs.forEach(o => {
      const u = (o.phase + t * 0.90) % 1.0;
      o.mesh.position.set(0, -0.52 + u * 1.04, 0.04);
    });
    srOrbs.forEach((o, i) => {
      o.mesh.position.y = o.baseY + Math.sin(t * 2.0 + i) * 0.01;
    });
  }

  // 4. Mas Raka Character Rig & Pose States
  const moodNames = ['alert', 'panic', 'focused', 'smile', 'pain'];
  const curMood = isOutroStage ? 'smile' : (moodNames[Math.round(S.rakaMood)] || 'alert');
  const blinkCycle = ((t + 0.85) % 3.4);
  const isBlinking = curMood !== 'panic' && curMood !== 'pain' && (blinkCycle > 3.18 && blinkCycle < 3.32);
  updateRakaFace(curMood, isBlinking);

  const breath = Math.sin(t * 3.2) * 0.008;
  handTieProp.visible = !isOutroStage && S.handTieVis > 0.5;
  RAKA.calfTourniquetR.visible = !isOutroStage && S.legTieVis > 0.5;
  RAKA.dangerGlowR.material.opacity = S.tieDangerGlow * (0.35 + 0.25 * Math.sin(t * 10.0));
  RAKA.swellHaloR.material.opacity = S.swellAlpha * (0.65 + 0.25 * Math.sin(t * 8.0));
  RAKA.swellHaloR.scale.setScalar(1.0 + S.swellAlpha * (0.12 + 0.08 * Math.sin(t * 8.0)));
  RAKA.splintGroupR.visible = !isOutroStage && S.splintVis > 0.5;
  RAKA.splintGroupR.scale.setScalar(S.splintVis > 0.5 ? Math.max(0.01, S.splintProg) : 1);
  footRestGroup.visible = S.footRestVis > 0.5;
  RAKA.phoneGroup.visible = !isOutroStage && S.rakaHoldPhone > 0.5;

  // Shoe & Watch Removal Animation (S18+)
  const sp = S.shoeOffProg;
  RAKA.shoeRGroup.position.set(sp * -0.18, -0.35 - sp * 0.14, 0.05 + sp * 0.25);
  RAKA.shoeRGroup.rotation.set(sp * 0.25, sp * 0.35, 0);
  RAKA.shoeRGroup.visible = sp < 0.85;
  if (RAKA.watchMesh) {
    RAKA.watchMesh.position.y = -0.32 - sp * 0.18;
    RAKA.watchMesh.visible = sp < 0.85;
  }
  detachedItemsGroup.visible = !isOutroStage && sp > 0.75;

  const pose = isOutroStage ? 3 : Math.round(S.rakaPose);
  if (RAKA.backpackGroup) RAKA.backpackGroup.visible = (pose === 0 || pose === 1);
  const hipBaseY = pose === 0 ? 0.56 : 0.72;
  RAKA.legL.hip.position.y = hipBaseY;
  RAKA.legR.hip.position.y = hipBaseY;

  if (pose === 3) {
    // Outro Stage: Centered inside Badge Circle — clean side wave away from face
    RAKA.root.position.set(0, 0.42 + S.outroLiftY + breath, 0);
    RAKA.root.rotation.set(0, 0, 0);
    RAKA.bodyPivot.position.set(0, 0.72, 0);
    RAKA.bodyPivot.rotation.set(0, 0, 0);
    RAKA.legL.hip.rotation.set(0, 0, 0); RAKA.legL.knee.rotation.set(0, 0, 0);
    RAKA.legR.hip.rotation.set(0, 0, 0); RAKA.legR.knee.rotation.set(0, 0, 0);
    RAKA.armL.root.rotation.set(-0.25, 0, -0.14); RAKA.armL.forearmPivot.rotation.set(0, 0, 0); RAKA.armL.handPivot.rotation.set(0, 0, 0);
    RAKA.armR.root.rotation.set(-0.30, 0, -2.25 - Math.sin(t * 7.5) * 0.10); RAKA.armR.forearmPivot.rotation.set(-0.22, 0, -0.18); RAKA.armR.handPivot.rotation.set(0, 0, 0);
    RAKA.headPivot.rotation.set(Math.sin(S.outroNod * Math.PI) * 0.16, Math.sin(t * 2.2) * 0.04, S.outroHeadTilt);
  } else if (pose === 2) {
    // S21: Reclined calmly centered ON TOP OF Hospital Stretcher (head well inside left edge, splinted leg visible)
    RAKA.root.position.set(S.stretcherX + 0.88, 0.74, 0.35);
    RAKA.root.rotation.set(-1.18, 0, Math.PI / 2);
    RAKA.bodyPivot.position.set(0, 0.72, 0);
    RAKA.bodyPivot.rotation.set(0.22, 0, 0);
    RAKA.legL.hip.rotation.set(-0.22, 0, 0); RAKA.legL.knee.rotation.set(0.20, 0, 0);
    RAKA.legR.hip.rotation.set(-0.10, 0, 0); RAKA.legR.knee.rotation.set(0.05, 0, 0);
    RAKA.armL.root.rotation.set(-0.20, 0, -0.15); RAKA.armL.forearmPivot.rotation.set(-0.35, 0, 0);
    RAKA.armR.root.rotation.set(-0.20, 0, 0.15); RAKA.armR.forearmPivot.rotation.set(-0.35, 0, 0);
    RAKA.headPivot.rotation.set(0.25, 0.15, 0);
  } else if (pose === 1) {
    // S09: Panic Running in place with rapid pumping legs!
    const stride = Math.sin(t * 14.0);
    RAKA.root.position.set(-0.35, 0.08 + Math.abs(Math.cos(t * 14.0)) * 0.10, 0);
    RAKA.root.rotation.set(0.18, 0.35, 0);
    RAKA.bodyPivot.position.set(0, 0.72, 0);
    RAKA.bodyPivot.rotation.set(0.22, 0, 0);
    RAKA.legL.hip.rotation.set(stride * 0.75, 0, 0); RAKA.legL.knee.rotation.set(Math.max(0, -stride) * 0.85, 0, 0);
    RAKA.legR.hip.rotation.set(-stride * 0.75, 0, 0); RAKA.legR.knee.rotation.set(Math.max(0, stride) * 0.85, 0, 0);
    RAKA.armL.root.rotation.set(-stride * 0.85 - 0.3, 0, -0.15); RAKA.armL.forearmPivot.rotation.set(-0.85, 0, 0);
    RAKA.armR.root.rotation.set(stride * 0.85 - 0.3, 0, 0.15); RAKA.armR.forearmPivot.rotation.set(-0.85, 0, 0);
    RAKA.headPivot.rotation.set(0.12, -0.15, 0);
  } else {
    // Seated on Forest Log Bench (S01-S03, S16-S20, S24)
    RAKA.root.position.set(-0.48, 0.0 + breath, -0.45);
    RAKA.root.rotation.set(0, 0, 0);
    RAKA.bodyPivot.position.set(0, 0.56, 0);
    const leanFwd = S.rakaReachTie * 0.22;
    RAKA.bodyPivot.rotation.set(leanFwd, 0, 0);

    // Legs: Both hips seated flush at hipBaseY=0.56 on top of log; Right leg extends cleanly on boulder in S16-S20 & S24!
    RAKA.legL.hip.rotation.set(-1.42, 0.08, 0); RAKA.legL.knee.rotation.set(1.40, 0, 0);
    const st = S.rakaLegStraight;
    RAKA.legR.hip.rotation.set(-1.38 * (1 - st) + (-1.52) * st, -0.06, 0);
    RAKA.legR.knee.rotation.set(1.36 * (1 - st) + 0.06 * st, 0, 0);

    // Arms
    if (S.rakaHoldPhone > 0.5) {
      // S20 holding phone toward foreground snake with visible camera viewfinder screen
      RAKA.armR.root.rotation.set(-1.12, 0.22, 0.16);
      RAKA.armR.forearmPivot.rotation.set(-0.42, 0, 0);
      RAKA.armR.handPivot.rotation.set(0.28, -0.35, 0);
      RAKA.armL.root.rotation.set(-0.35, 0, -0.15); RAKA.armL.forearmPivot.rotation.set(-0.45, 0, 0);
    } else if (S.rakaReachTie > 0.35) {
      // S01-S03: When hands are raised out/apart from the knee/calf silhouette, the red cloth tourniquet & bent knee joint stay 100% crisp!
      RAKA.armL.root.rotation.set(-0.72, -0.25, -0.15);
      RAKA.armL.forearmPivot.rotation.set(-0.42, 0, 0);
      if (t < 3.75) {
        // S01 snake bite reaction: right hand holds hip/thigh side
        RAKA.armR.root.rotation.set(-0.42, 0.18, 0.24);
        RAKA.armR.forearmPivot.rotation.set(-0.48, 0, 0);
      } else {
        // S02-S03 close-up: right arm pulled gently back/out so forearm NEVER overlaps the right knee or calf!
        RAKA.armR.root.rotation.set(-0.18, 0.25, 0.36);
        RAKA.armR.forearmPivot.rotation.set(-0.35, 0, 0);
      }
    } else if (S.rakaWave > 0.5 && t >= 74.5) {
      // S24 warm wave / calm seated sign-off (arm opened cleanly out to side away from face)
      RAKA.armL.root.rotation.set(-0.28, 0, -0.16); RAKA.armL.forearmPivot.rotation.set(-0.35, 0, 0);
      RAKA.armR.root.rotation.set(-0.32, 0, -2.05 - Math.sin(t * 5.5) * 0.09); RAKA.armR.forearmPivot.rotation.set(-0.24, 0, -0.18);
    } else {
      // Calm seated posture S16-S19
      RAKA.armL.root.rotation.set(-0.32, 0, -0.16); RAKA.armL.forearmPivot.rotation.set(-0.42, 0, 0);
      RAKA.armR.root.rotation.set(-0.32, 0, 0.16);  RAKA.armR.forearmPivot.rotation.set(-0.42, 0, 0);
    }
    RAKA.headPivot.rotation.set(S.rakaHeadPitch, S.rakaHeadYaw, S.rakaHeadRoll);
  }

  // 5. Dynamic 3D Callout Target Anchors
  let c1T = new THREE.Vector3(), c1Ox = 165, c1Oy = -140;
  let c2T = new THREE.Vector3(), c2Ox = 165, c2Oy = -140;
  let c3T = new THREE.Vector3(), c3Ox = 165, c3Oy = -140;

  if (t < 11.90) {
    c1T = getWorldAnchor(RAKA.calfTourniquetR); c1Ox = 165; c1Oy = -145;
  } else if (t < 20.85) {
    c1T = getWorldAnchor(lymphVesselMesh, new THREE.Vector3(0, 0.25, 0)); c1Ox = -175; c1Oy = -130;
  } else if (t < 23.60) {
    c1T = getWorldAnchor(heartPumpGroup); c1Ox = 185; c1Oy = -125;
  } else if (t < 28.65) {
    c1T = getWorldAnchor(RAKA.legR.knee, new THREE.Vector3(0, -0.15, 0)); c1Ox = 165; c1Oy = -135;
  } else if (t < 31.85) {
    c1T = getWorldAnchor(muscleL, new THREE.Vector3(0, 0.15, 0)); c1Ox = -185; c1Oy = -120;
  } else if (t < 40.35) {
    c1T = getWorldAnchor(xrayLowerShell); c1Ox = 175; c1Oy = -125;
  } else {
    c1T = getWorldAnchor(splitLeft); c1Ox = -110; c1Oy = -155;
  }

  if (t < 17.50) {
    c2T = getWorldAnchor(bloodVesselMesh, new THREE.Vector3(0, 0.15, 0)); c2Ox = 185; c2Oy = -125;
  } else if (t < 26.35) {
    c2T = getWorldAnchor(lymphVesselMesh, new THREE.Vector3(0, 0.25, 0)); c2Ox = -175; c2Oy = -125;
  } else {
    c2T = getWorldAnchor(infectionGlow); c2Ox = -185; c2Oy = -120;
  }

  if (t < 52.80) {
    c3T = getWorldAnchor(miniXrayGroup); c3Ox = -175; c3Oy = -135;
  } else if (t < 58.30) {
    c3T = getWorldAnchor(RAKA.swellHaloR); c3Ox = 185; c3Oy = -140;
  } else if (t < 66.00) {
    c3T = getWorldAnchor(snakeHead); c3Ox = 85; c3Oy = -165;
  } else if (t < 67.85) {
    c3T = getWorldAnchor(ambulanceGroup, new THREE.Vector3(0.45, 1.55, 0.3)); c3Ox = -70; c3Oy = -145;
  } else {
    c3T = getWorldAnchor(serumVialGroup); c3Ox = -45; c3Oy = 220;
  }

  const c4T = getWorldAnchor(RAKA.splintGroupR);
  setCalloutLine('#line-c1', '#dot-c1', $('#call1'), c1T, c1Ox, c1Oy, S.c1Alpha);
  setCalloutLine('#line-c2', '#dot-c2', $('#call2'), c2T, c2Ox, c2Oy, S.c2Alpha);
  setCalloutLine('#line-c3', '#dot-c3', $('#call3'), c3T, c3Ox, c3Oy, S.c3Alpha);
  setCalloutLine('#line-c4', '#dot-c4', $('#call4'), c4T, 185, -145, S.c4Alpha);

  renderer.render(scene, camera);
}

/* ============ 9. STAGE SCALE & DETERMINISTIC CAPTURE HOOKS ============ */
const stage = $('#stage');
const fit = () => {
  const s = Math.min(innerWidth / W, innerHeight / H);
  stage.style.transform = `translate(-50%,-50%) scale(${s})`;
};
addEventListener('resize', fit);
fit();

const audioEl = $('#vo-audio');
let isPlaying = false;
const isDeterministicCapture = Q.has('clean') || Q.has('capture');

if (!isDeterministicCapture) {
  (function frame() {
    if (!window.THUMB_LOCK) {
      if (isPlaying && !audioEl.paused) tl.time(audioEl.currentTime, false);
      render(tl.time());
    }
    requestAnimationFrame(frame);
  })();
}

$('#btn-play').onclick = () => {
  if (audioEl.paused) {
    isPlaying = true; audioEl.play(); tl.play(audioEl.currentTime);
    $('#btn-play').textContent = '⏸ Pause';
  } else {
    isPlaying = false; audioEl.pause(); tl.pause();
    $('#btn-play').textContent = '▶ Play Master + Audio';
  }
};

document.querySelectorAll('#switcher button[data-t]').forEach(btn => {
  btn.onclick = () => {
    const t = parseFloat(btn.dataset.t);
    isPlaying = false; audioEl.pause(); audioEl.currentTime = t;
    tl.pause(t); render(t);
    $('#btn-play').textContent = '▶ Play Master + Audio';
  };
});

const seek = (t) => {
  document.body.classList.add('clean-snap');
  isPlaying = false;
  tl.pause();
  tl.time(t, false);
  if (gsap.ticker.tick) gsap.ticker.tick();
  render(t);
  const gl = renderer.getContext();
  if (gl && gl.finish) gl.finish();
  return new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(() => resolve(true))));
};

window.OPENER = {
  tl, DURATION, W, H, seek, S, render, RAKA, renderer, scene, camera,
  snakeGroup, SNAKE_RIG, handTieProp, footRestGroup,
  xrayGroup, xrayLowerShell, xrayStrapGroup, amputationPlaneRing, lymphVesselMesh, bloodVesselMesh,
  ready: false
};

const avatarImg = $('#outro-avatar-img');
const avatarReady = avatarImg && avatarImg.decode ? avatarImg.decode().catch(() => {}) : Promise.resolve();
Promise.all([document.fonts.ready, avatarReady]).then(() => {
  window.OPENER.ready = true;
  if (!Q.has('clean')) render(0);
});
</script>
</body>
