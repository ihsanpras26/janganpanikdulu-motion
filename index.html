<style>
/* ===== LOCKED BRAND IDENTITY (OPSI 2): Crisp White (#FFFFFF) x Deep Indigo (#261A66) x Solid Orange (#EF5F18) ===== */
:root{
  --brand-orange:#EF5F18;
  --brand-blue:#261A66;
  --brand-white:#FFFFFF;
  --scrim-rgb:20,14,54;

  --hook-stroke:#261A66;
  --hook-pill-bg:#261A66; --hook-pill-ink:#FFFFFF; --hook-pill-shadow:#EF5F18;

  --step-pill-bg:#FFFFFF; --step-pill-ink:#261A66; --step-pill-border:#261A66;
  --step-num-bg:#EF5F18; --step-num-ink:#FFFFFF;
  --prog-track:rgba(255,255,255,.45); --prog-fill:#EF5F18;

  --sub-bg:#FFFFFF; --sub-ink:#261A66; --sub-border:#261A66;
  --sub-hl-bg:#EF5F18; --sub-hl-ink:#FFFFFF;

  --safe:#0FA968; --danger:#EF5F18;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{
  width:100%;height:100%;background:#0F141A;overflow:hidden;
  font-family:"Plus Jakarta Sans",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
}
#stage{
  position:fixed;left:50%;top:50%;width:1080px;height:1920px;
  transform:translate(-50%,-50%) scale(1);overflow:hidden;
  background:linear-gradient(180deg,#DFEEF9 0%,#F2F7FC 44%,#EAE2D6 100%);
}
#gl{position:absolute;inset:0;width:1080px;height:1920px;display:block;z-index:1}
#OverlaySVG{position:absolute;inset:0;width:1080px;height:1920px;pointer-events:none;z-index:4}
#OverlaySVG line{stroke-width:3.5;stroke-linecap:round}
#line-c1,#line-c2{stroke:var(--danger)}
#dot-c1,#dot-c2{fill:var(--danger);stroke:#FFFFFF;stroke-width:3}
#line-c3{stroke:var(--safe)}
#dot-c3{fill:var(--safe);stroke:#FFFFFF;stroke-width:3}

#hud{position:absolute;inset:0;pointer-events:none;z-index:6}

/* Subtle Contrast Scrims */
.scrim-top{
  position:absolute;left:0;right:0;top:0;height:260px;
  background:linear-gradient(180deg,rgba(var(--scrim-rgb),.32) 0%,rgba(var(--scrim-rgb),.10) 52%,rgba(var(--scrim-rgb),0) 100%);
}
.scrim-bottom{
  position:absolute;left:0;right:0;bottom:0;height:280px;
  background:linear-gradient(0deg,rgba(var(--scrim-rgb),.18) 0%,rgba(var(--scrim-rgb),.06) 50%,rgba(var(--scrim-rgb),0) 100%);
}

/* ZONA 1: Frosted Glass Translucent Brand Watermark di Kiri Atas */
.account-card{
  position:absolute;left:44px;top:46px;
  display:inline-flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.70);
  backdrop-filter:blur(18px) saturate(160%);
  -webkit-backdrop-filter:blur(18px) saturate(160%);
  padding:8px 20px 9px 14px;
  border-radius:999px;
  border:1.5px solid rgba(255,255,255,.85);
  box-shadow:0 10px 24px rgba(20,14,54,.12), inset 0 1px 0 rgba(255,255,255,.95);
  font-size:21px;font-weight:800;letter-spacing:-.015em;
  color:var(--brand-blue);
}
.account-dot{
  width:9px;height:9px;border-radius:50%;
  background:var(--brand-orange);
  display:inline-block;
  box-shadow:0 0 8px rgba(239,95,24,.5);
}

/* ZONA 2A: HOOK LOCKUP (Hanya muncul SEKALI di awal 0.00s - 3.46s!) */
#hook-card{
  position:absolute;left:46px;right:46px;top:148px;
  display:flex;flex-direction:column;align-items:center;gap:14px;
  will-change:transform,opacity;
}
.hook-title{
  font-size:90px;font-weight:800;letter-spacing:-.035em;line-height:1;
  color:#FFFFFF;text-align:center;
  -webkit-text-stroke:14px var(--hook-stroke);paint-order:stroke fill;
  text-shadow:0 10px 24px rgba(20,14,54,.28);
}
.hook-pill{
  background:var(--hook-pill-bg);color:var(--hook-pill-ink);
  font-size:42px;font-weight:800;letter-spacing:-.02em;
  padding:13px 36px;border-radius:16px;transform:rotate(-1.2deg);
  border:3.5px solid #FFFFFF;
  box-shadow:0 9px 0 var(--hook-pill-shadow), 0 16px 30px rgba(20,14,54,.28);
}

/* ZONA 2B: ULTRA-CLEAN SINGLE TOP PILL ala @puckermanefacts (Hanya untuk 3 Langkah Penting) */
#step-tracker{
  position:absolute;left:0;right:0;top:132px;
  display:flex;flex-direction:column;align-items:center;gap:14px;
  opacity:0;will-change:transform,opacity;
}
.step-pill{
  display:inline-flex;align-items:center;gap:14px;
  background:rgba(255,255,255,.82);
  backdrop-filter:blur(16px) saturate(150%);
  -webkit-backdrop-filter:blur(16px) saturate(150%);
  padding:10px 30px 10px 12px;border-radius:999px;
  border:2px solid rgba(255,255,255,.88);
  box-shadow:0 12px 28px rgba(20,14,54,.16);
}
.step-pill.text-only{
  padding:11px 32px 12px;
}
.step-num{
  width:48px;height:48px;border-radius:50%;
  background:var(--step-num-bg);color:var(--step-num-ink);
  font-family:"Space Grotesk","Plus Jakarta Sans",sans-serif;
  font-size:25px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.step-title{
  font-size:34px;font-weight:800;letter-spacing:-.02em;
  color:var(--step-pill-ink);white-space:nowrap;
}
.progress{display:flex;gap:14px;align-items:center}
.progress i{
  width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.75);
  border:2.5px solid rgba(38,26,102,.25);
  display:block;box-shadow:0 3px 8px rgba(20,14,54,.15);
}
.progress i.on{
  background:var(--prog-fill);
  border-color:#FFFFFF;
}

/* ZONA 3: COMPACT 3D CALLOUT LABELS ala @puckermanefacts (Kecil, Clean, Tanpa Ikon Ramai) */
.callout{
  position:absolute;left:0;top:0;
  background:rgba(255,255,255,.88);
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  padding:8px 18px 9px;border-radius:12px;
  font-size:25px;font-weight:800;letter-spacing:-.015em;white-space:nowrap;opacity:0;
  box-shadow:0 8px 20px rgba(12,10,36,.18);
  display:inline-flex;align-items:center;
  will-change:transform,opacity;
}
.callout.danger{color:var(--danger);border:2.5px solid var(--danger)}
.callout.safe{color:var(--safe);border:2.5px solid var(--safe)}

/* ZONA 4: 3 STUDIO CAPTION OPTIONS (Pure Natural Spacing, Zero Word-Box Padding, Translucent Blur) */
#sub-wrap{
  position:absolute;left:44px;right:44px;bottom:136px;display:flex;justify-content:center;
}
.sub-card{
  max-width:980px;
  padding:16px 34px 18px;
  border-radius:20px;
  font-size:36px;font-weight:800;letter-spacing:-.016em;line-height:1.30;
  text-align:center;
  display:inline-block;
  will-change:transform,opacity;
}
.sub-card .w{
  display:inline-block;
  padding:0;
  margin:0;
  background:transparent;
  position:relative;
  transition:color .08s ease, opacity .08s ease, transform .10s ease;
}

/* OPSI 1 (Default): Frosted Daylight Glass + Editorial Signal Color Flow */
body.cap-opt-1 .sub-card,
body:not(.cap-opt-2):not(.cap-opt-3) .sub-card{
  background:rgba(255,255,255,.70);
  backdrop-filter:blur(20px) saturate(170%);
  -webkit-backdrop-filter:blur(20px) saturate(170%);
  border:1.5px solid rgba(255,255,255,.88);
  box-shadow:0 14px 34px rgba(20,14,54,.14), inset 0 1px 0 rgba(255,255,255,.92);
}
body.cap-opt-1 .sub-card .w.past,
body:not(.cap-opt-2):not(.cap-opt-3) .sub-card .w.past{
  color:#261A66;opacity:1;
}
body.cap-opt-1 .sub-card .w.active,
body:not(.cap-opt-2):not(.cap-opt-3) .sub-card .w.active{
  color:#EF5F18;opacity:1;
  transform:translateY(-1.5px);
}
body.cap-opt-1 .sub-card .w.future,
body:not(.cap-opt-2):not(.cap-opt-3) .sub-card .w.future{
  color:rgba(38,26,102,.38);
}

/* OPSI 2: Smoked Deep-Indigo Cinema Glass + Crisp White & Amber-Orange Pop */
body.cap-opt-2 .sub-card{
  background:rgba(24,18,62,.66);
  backdrop-filter:blur(22px) saturate(175%);
  -webkit-backdrop-filter:blur(22px) saturate(175%);
  border:1.5px solid rgba(255,255,255,.22);
  box-shadow:0 16px 38px rgba(10,8,32,.26), inset 0 1px 0 rgba(255,255,255,.20);
}
body.cap-opt-2 .sub-card .w.past{
  color:#FFFFFF;opacity:1;
}
body.cap-opt-2 .sub-card .w.active{
  color:#FF742E;opacity:1;
  transform:translateY(-1.5px);
}
body.cap-opt-2 .sub-card .w.future{
  color:rgba(255,255,255,.40);
}

/* OPSI 3: Clear Frosted Pill Capsule + Precision Underline Indicator */
body.cap-opt-3 .sub-card{
  background:rgba(255,255,255,.62);
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1.5px solid rgba(255,255,255,.86);
  border-radius:999px;
  padding:15px 40px 20px;
  box-shadow:0 14px 34px rgba(20,14,54,.14), inset 0 1px 0 rgba(255,255,255,.94);
}
body.cap-opt-3 .sub-card .w.past{
  color:#261A66;opacity:1;
}
body.cap-opt-3 .sub-card .w.active{
  color:#EF5F18;opacity:1;
}
body.cap-opt-3 .sub-card .w.active::after{
  content:"";
  position:absolute;left:0;right:0;bottom:-4px;height:4px;
  border-radius:99px;
  background:#EF5F18;
}
body.cap-opt-3 .sub-card .w.future{
  color:rgba(38,26,102,.42);
}

/* Interactive Preview Toolbar (disembunyikan saat capture MP4) */
#switcher{
  position:fixed;left:50%;bottom:12px;transform:translateX(-50%);z-index:80;
  display:flex;gap:10px;align-items:center;
  background:rgba(24,30,38,.94);padding:10px 16px;border-radius:16px;color:#fff;font-size:12px;
}
body.clean-snap #switcher{display:none !important}
#switcher .sw-label{font-weight:800;color:#EF5F18;text-transform:uppercase}
#switcher button{background:#2D3748;color:#fff;border:none;padding:7px 12px;border-radius:8px;font:700 12px inherit;cursor:pointer}
#switcher button.active{background:#EF5F18}
#time-readout{font-family:"Space Grotesk",monospace;font-size:13px;font-weight:700;color:#90E0EF;min-width:95px;text-align:center}
</style>

<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const $ = s => document.querySelector(s);
const Q = new URLSearchParams(location.search);
if (Q.has('clean') || Q.has('capture')) document.body.classList.add('clean-snap');

/* ============ 1. RENDERER & CAMERA (NARROW-FOV @puckermanefacts ARCHITECTURAL LENS) ============ */
const W = 1080, H = 1920;
const renderer = new THREE.WebGLRenderer({
  canvas: $('#gl'),
  antialias: true,
  alpha: true,
  preserveDrawingBuffer: true
});
renderer.setPixelRatio(Q.has('clean') ? 1.5 : Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(W, H, false);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(25, W / H, 0.2, 160);

const hemi = new THREE.HemisphereLight(0xFFFDF9, 0xD8CFC4, 1.68);
hemi.position.set(0, 18, 0);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xFFF7EB, 2.28);
sun.position.set(7.5, 14.0, 9.5);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
const sd = 6.8;
sun.shadow.camera.left = -sd;
sun.shadow.camera.right = sd;
sun.shadow.camera.top = sd;
sun.shadow.camera.bottom = -sd;
sun.shadow.bias = -0.0005;
scene.add(sun);

const rim = new THREE.DirectionalLight(0x90E0EF, 0.88);
rim.position.set(-7, 6, -5);
scene.add(rim);

const sparkLight = new THREE.PointLight(0xFF7B00, 0, 5.0);
sparkLight.position.set(1.72, 1.94, -2.30);
scene.add(sparkLight);

const mat = (hex, rough = 0.45, metal = 0.03, emissive = 0x000000, emInt = 0) =>
  new THREE.MeshStandardMaterial({ color: hex, roughness: rough, metalness: metal, emissive, emissiveIntensity: emInt });

const outlineMat = new THREE.MeshBasicMaterial({ color: 0x181E26, side: THREE.BackSide });
function withOutline(mesh, scale = 1.06) {
  const out = new THREE.Mesh(mesh.geometry, outlineMat);
  out.scale.setScalar(scale);
  mesh.add(out);
  return mesh;
}

/* ============ 2. LINGKUNGAN DAPUR 3D (@puckermanefacts CUTAWAY + GAS MELON 3KG INDONESIA CLEAN) ============ */
const world = new THREE.Group();
scene.add(world);

function makeTileTexture() {
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 512;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#F6F4EF';
  ctx.fillRect(0, 0, 512, 512);
  ctx.strokeStyle = '#DDD6C9';
  ctx.lineWidth = 6;
  for (let i = 0; i <= 512; i += 64) {
    ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 512); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(512, i); ctx.stroke();
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(2, 2);
  return tex;
}

function makeBacksplashTexture() {
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 256;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#F2EFE9';
  ctx.fillRect(0, 0, 512, 256);
  ctx.strokeStyle = '#D5CFC4';
  ctx.lineWidth = 4;
  for (let y = 0; y <= 256; y += 32) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(512, y); ctx.stroke();
    const offset = (y / 32) % 2 === 0 ? 0 : 32;
    for (let x = offset; x <= 512; x += 64) {
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + 32); ctx.stroke();
    }
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.repeat.set(4, 2);
  return tex;
}

function makeWoodTexture() {
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 512;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#E0B583';
  ctx.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 8; i++) {
    ctx.fillStyle = i % 2 === 0 ? '#E0B583' : '#D6AA78';
    ctx.fillRect(0, i * 64, 512, 64);
    ctx.strokeStyle = '#C09260';
    ctx.lineWidth = 4;
    ctx.strokeRect(0, i * 64, 512, 64);
  }
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function makeGasMelonTexture() {
  // Clean Gas Melon 3kg tanpa teks (hanya warna hijau khas + lingkar merah di bahu atas)
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 512;
  const ctx = cv.getContext('2d');
  ctx.fillStyle = '#62BF8A';
  ctx.fillRect(0, 0, 512, 512);

  ctx.fillStyle = '#E63946';
  ctx.fillRect(0, 52, 512, 50);

  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

// Lapisan Tanah & Rumput Cutaway (@puckermanefacts Architectural Diorama Base)
const soil = withOutline(
  new THREE.Mesh(new RoundedBoxGeometry(8.2, 0.86, 8.2, 4, 0.06), mat(0x9C6B43, 0.75)),
  1.015
);
soil.position.set(-0.20, -0.46, -0.05);
world.add(soil);

const grass = withOutline(
  new THREE.Mesh(new RoundedBoxGeometry(8.2, 0.18, 8.2, 4, 0.04), mat(0x52B788, 0.65)),
  1.015
);
grass.position.set(-0.20, 0.02, -0.05);
grass.receiveShadow = true;
world.add(grass);

// Teras Batu Luar & Tanaman Halaman di Depan Pintu Dapur (Outdoor Patio & Shrub)
const patioStep = withOutline(
  new THREE.Mesh(new RoundedBoxGeometry(1.42, 0.12, 1.68, 3, 0.03), mat(0xDBD5CA, 0.52)),
  1.03
);
patioStep.position.set(-3.52, 0.14, 1.05);
patioStep.receiveShadow = true;
world.add(patioStep);

const planterPot = withOutline(
  new THREE.Mesh(new THREE.CylinderGeometry(0.24, 0.19, 0.34, 20), mat(0xC86D44, 0.55)),
  1.05
);
planterPot.position.set(-3.52, 0.28, 2.22);
planterPot.castShadow = true;
world.add(planterPot);

const planterBush = withOutline(
  new THREE.Mesh(new THREE.SphereGeometry(0.32, 20, 16), mat(0x3DA36D, 0.55)),
  1.05
);
planterBush.position.set(-3.52, 0.62, 2.22);
planterBush.scale.set(1.0, 1.12, 1.0);
planterBush.castShadow = true;
world.add(planterBush);

const floorSlab = new THREE.Mesh(
  new THREE.BoxGeometry(5.8, 0.24, 5.8),
  new THREE.MeshStandardMaterial({ map: makeTileTexture(), roughness: 0.45 })
);
floorSlab.position.set(-0.05, 0.22, -0.05);
floorSlab.receiveShadow = true;

function makeSparkGeo(R = 0.36, r = 0.12, depth = 0.08) {
  const s = new THREE.Shape();
  for (let i = 0; i < 12; i++) {
    const a = (i * Math.PI) / 6 - Math.PI / 2;
    const rad = i % 2 === 0 ? R : r;
    const x = Math.cos(a) * rad, y = Math.sin(a) * rad;
    if (i === 0) s.moveTo(x, y); else s.lineTo(x, y);
  }
  s.closePath();
  const g = new THREE.ExtrudeGeometry(s, { depth, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.02, bevelSegments: 2 });
  g.center();
  return g;
}

function makeMasFaceTexture() {
  const cv = document.createElement('canvas');
  cv.width = 512; cv.height = 512;
  const ctx = cv.getContext('2d');
  ctx.clearRect(0, 0, 512, 512);

  ctx.fillStyle = '#181E26';
  ctx.strokeStyle = '#181E26';
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  ctx.lineWidth = 20;
  ctx.beginPath();
  ctx.moveTo(112, 174);
  ctx.quadraticCurveTo(156, 160, 204, 172);
  ctx.moveTo(308, 168);
  ctx.quadraticCurveTo(356, 152, 400, 170);
  ctx.stroke();

  [158, 354].forEach(cx => {
    ctx.fillStyle = '#181E26';
    ctx.beginPath();
    ctx.roundRect(cx - 22, 202, 44, 58, 21);
    ctx.fill();
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath();
    ctx.arc(cx - 7, 220, 9, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.strokeStyle = 'rgba(145, 92, 58, 0.78)';
  ctx.lineWidth = 10;
  ctx.beginPath();
  ctx.moveTo(256, 218);
  ctx.lineTo(248, 268);
  ctx.lineTo(268, 272);
  ctx.stroke();

  ctx.strokeStyle = '#181E26';
  ctx.lineWidth = 14;
  ctx.beginPath();
  ctx.moveTo(208, 328);
  ctx.quadraticCurveTo(258, 350, 310, 316);
  ctx.stroke();

  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

/* ============ 5. SMOOTH EASE-IN / EASE-OUT & 100% VERBATIM SUBTITLE SCHEDULE ============ */
function easeOutBack(x) {
  const c1 = 1.70158;
  const c3 = c1 + 1;
  return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
}
function easeInQuad(x) {
  return x * x;
}
function easeOutCubic(x) {
  return 1 - Math.pow(1 - x, 3);
}

function getWindowMotion(t, tIn, tOut, enterDur = 0.36, exitDur = 0.26) {
  if (t < tIn || t > tOut) return { alpha: 0, y: -22, scale: 0.90 };
  if (t - tIn < enterDur) {
    const p = Math.max(0, Math.min(1, (t - tIn) / enterDur));
    const eb = easeOutBack(p);
    return {
      alpha: Math.min(1, p * 1.35),
      y: (1 - eb) * -24,
      scale: 0.88 + 0.12 * eb
    };
  }
  if (tOut - t < exitDur) {
    const p = Math.max(0, Math.min(1, (tOut - t) / exitDur));
    const eq = 1 - easeInQuad(1 - p);
    return {
      alpha: eq,
      y: (1 - eq) * -18,
      scale: 0.94 + 0.06 * eq
    };
  }
  return { alpha: 1, y: 0, scale: 1 };
}

  { s: 36.60, e: 37.80, words: ['Kalau', 'mencium', 'bau', 'gas,'] },

  // S10 (39.64s - 43.18s): "Pertama, jangan sentuh saklar lampu atau alat elektronik apa pun."
  { s: 39.62, e: 41.50, words: ['Pertama,', 'jangan', 'sentuh', 'saklar', 'lampu'] },
  { s: 41.54, e: 43.24, words: ['atau', 'alat', 'elektronik', 'apa', 'pun.'] },

  // S11 (43.63s - 47.03s): "Kedua, putar pengunci regulator, dan lepas dari tabung gas."
  { s: 43.61, e: 45.94, words: ['Kedua,', 'putar', 'pengunci', 'regulator,'] },
  { s: 46.00, e: 47.12, words: ['dan', 'lepas', 'dari', 'tabung', 'gas.'] },

  // S12 (47.46s - 52.35s): "Ketiga, buka pintu dan jendela lebar-lebar, supaya udara luar mendorong gas keluar."
  { s: 47.44, e: 48.48, words: ['Ketiga,', 'buka', 'pintu'] },
  { s: 48.51, e: 50.14, words: ['dan', 'jendela', 'lebar-lebar,'] },
  { s: 50.22, e: 52.42, words: ['supaya', 'udara', 'luar', 'mendorong', 'gas', 'keluar.'] },

  // S13 (52.83s - 56.93s): "Jadi yang memicu ledakan bukan tabungnya, tapi percikan listrik saat kita panik."
  { s: 52.81, e: 53.96, words: ['Jadi', 'yang', 'memicu', 'ledakan'] },
  { s: 53.99, e: 55.06, words: ['bukan', 'tabungnya,'] },
  { s: 55.16, e: 57.00, words: ['tapi', 'percikan', 'listrik', 'saat', 'kita', 'panik.'] },

  // S14 (57.38s - 59.50s): "Jadi... jangan panik dulu." (Custom pause-aware timestamps)
  {
    s: 57.35, e: 59.56,
    words: ['Jadi...', 'jangan', 'panik', 'dulu.'],
    customTimes: [
      { word: 'Jadi...', ws: 57.36, we: 58.22 },
      { word: 'jangan',  ws: 58.26, we: 58.66 },
      { word: 'panik',   ws: 58.66, we: 59.04 },
      { word: 'dulu.',   ws: 59.04, we: 59.56 }
    ]
  }
];

const SPOKEN_WEIGHT_OVERRIDES = { '1.000': 6, '3': 4 };
CAPTION_CHUNKS.forEach(ch => {
  if (ch.customTimes) {
    ch.wordTimes = ch.customTimes;
    return;
  }
  const weights = ch.words.map(w => SPOKEN_WEIGHT_OVERRIDES[w] || Math.max(2, w.replace(/[^a-zA-Z0-9]/g, '').length));
  const totalW = weights.reduce((a, b) => a + b, 0);
  const span = (ch.e - ch.s) * 0.94;
  let cursor = ch.s + 0.02;
  ch.wordTimes = ch.words.map((w, idx) => {
    const dur = (weights[idx] / totalW) * span;
    const wt = { word: w, ws: cursor, we: cursor + dur };
    cursor += dur;
    return wt;
  });
});

// Apply ?caption=1 | 2 | 3 option from URL query & interactive switcher

});

const TOP_SEGMENTS = [
  { s: 0.00, e: 3.60, type: 'hook', hTitle: 'BAU GAS BOCOR?', hPill: 'JANGAN SENTUH SAKLAR!' },
  { s: 39.65, e: 43.58, type: 'step', badge: '1', title: 'Jangan sentuh saklar', showDots: true, prog: 1 },
  { s: 43.63, e: 47.42, type: 'step', badge: '2', title: 'Lepas regulator gas', showDots: true, prog: 2 },
  { s: 47.46, e: 52.78, type: 'step', badge: '3', title: 'Buka pintu & jendela', showDots: true, prog: 3 }
];

function setCalloutLine(lineId, dotId, callEl, worldTarget, offsetX, offsetY, alpha) {
  const line = $(lineId), dot = $(dotId);
  if (alpha <= 0.01) {
    callEl.style.opacity = '0';
    line.setAttribute('opacity', '0');
    dot.setAttribute('opacity', '0');
    return;
  }
  const v = worldTarget.clone().project(camera);
  const px = (v.x * 0.5 + 0.5) * W;
  const py = (-v.y * 0.5 + 0.5) * H;
  const cx = Math.max(210, Math.min(870, px + offsetX));
  const cy = Math.max(380, Math.min(1520, py + offsetY));

  const lineProg = easeOutCubic(Math.min(1, alpha * 1.35));
  const badgeProg = easeOutBack(Math.max(0, Math.min(1, (alpha - 0.18) / 0.82)));
  const badgeAlpha = Math.max(0, Math.min(1, (alpha - 0.15) / 0.65));

  const lx2 = px + (cx - px) * lineProg;
  const ly2 = py + (cy - py) * lineProg;

  line.setAttribute('x1', px.toFixed(1));
  line.setAttribute('y1', py.toFixed(1));
  line.setAttribute('x2', lx2.toFixed(1));
  line.setAttribute('y2', ly2.toFixed(1));
  line.setAttribute('opacity', Math.min(1, alpha * 1.4).toFixed(2));

  dot.setAttribute('cx', px.toFixed(1));
  dot.setAttribute('cy', py.toFixed(1));
  dot.setAttribute('r', (7 * Math.min(1.12, easeOutBack(Math.min(1, alpha * 1.5)))).toFixed(1));
  dot.setAttribute('opacity', Math.min(1, alpha * 1.5).toFixed(2));

  callEl.style.left = `${cx}px`;
  callEl.style.top = `${cy}px`;
  callEl.style.opacity = badgeAlpha.toFixed(2);
  const sc = (0.85 + 0.15 * badgeProg).toFixed(3);
  const ty = ((1 - badgeProg) * 12).toFixed(1);
  callEl.style.transform = `translate(-50%, calc(-50% + ${ty}px)) scale(${sc})`;
}

function updateHUD(t) {
  const hook = $('#hook-card'), tracker = $('#step-tracker'), subCard = $('#sub-card');
  const hookTitle = $('#hook-title'), hookPill = $('#hook-pill');
  const pillBox = $('#step-pill-box'), badgeEl = $('#tr-badge'), titleEl = $('#tr-title');
  const progWrap = $('#prog-wrap');
  const segs = [$('#seg1'), $('#seg2'), $('#seg3')];

  // 1. Update Sparse Top Header Segment
  const seg = TOP_SEGMENTS.find(x => t >= x.s && t <= x.e);
  if (!seg) {
    hook.style.opacity = '0';
    tracker.style.opacity = '0';
  } else if (seg.type === 'hook') {
    const m = getWindowMotion(t, seg.s, seg.e, 0.36, 0.26);
    tracker.style.opacity = '0';
    hook.style.opacity = m.alpha.toFixed(3);
    hook.style.transform = `translate3d(0, ${m.y.toFixed(1)}px, 0) scale(${m.scale.toFixed(3)})`;
    hookTitle.textContent = seg.hTitle;
    hookPill.textContent = seg.hPill;
  } else {
    const m = getWindowMotion(t, seg.s, seg.e, 0.36, 0.26);
    hook.style.opacity = '0';
    tracker.style.opacity = m.alpha.toFixed(3);
    tracker.style.transform = `translate3d(0, ${m.y.toFixed(1)}px, 0) scale(${m.scale.toFixed(3)})`;

    if (seg.badge) {
      badgeEl.style.display = 'flex';
      badgeEl.textContent = seg.badge;
      pillBox.classList.remove('text-only');
    } else {
      badgeEl.style.display = 'none';
      pillBox.classList.add('text-only');
    }
    titleEl.textContent = seg.title;
    progWrap.style.display = seg.showDots ? 'flex' : 'none';
    if (seg.showDots) segs.forEach((el, i) => el.classList.toggle('on', i < seg.prog));
  }

  // 2. Update Compact 3D Callout Text per Scene
  if (t < 7.55) {
    $('#call1-text').textContent = 'pemicu ledakan';
  } else if (t < 16.03) {
    $('#call1-text').textContent = '2 lempeng tembaga';
  } else if (t < 21.40) {
    $('#call1-text').textContent = 'percikan 1.000°C';
  } else if (t < 25.20) {
    $('#call2-text').textContent = 'mengendap di lantai';
  } else if (t < 30.90) {
    $('#call2-text').textContent = 'naik ke saklar';
  } else if (t < 36.62) {
    $('#call1-text').textContent = 'menyambar gas';
  } else if (t < 43.63) {
    $('#call3-text').textContent = 'jangan disentuh';
  } else if (t < 47.46) {
    $('#call3-text').textContent = 'lepas regulator';
  } else {
    $('#call3-text').textContent = 'pintu & jendela dibuka';
  }

  // 3. Update Verbatim Word-by-Word Subtitle Bar (Pure Natural Typography, Zero Box Padding)
  let activeChunk = CAPTION_CHUNKS.find(c => t >= c.s && t <= c.e);
  let gapAlpha = 1;
  if (!activeChunk) {
    activeChunk = CAPTION_CHUNKS.reduce((best, cur) => {
      const dist = Math.min(Math.abs(t - cur.s), Math.abs(t - cur.e));
      const bestDist = Math.min(Math.abs(t - best.s), Math.abs(t - best.e));
      return dist < bestDist ? cur : best;
    }, CAPTION_CHUNKS[0]);
    const minDist = Math.min(Math.abs(t - activeChunk.s), Math.abs(t - activeChunk.e));
    if (minDist > 0.14) {
      gapAlpha = Math.max(0, 1 - (minDist - 0.14) / 0.18);
    }
  }

  const dtChunk = Math.max(0, t - activeChunk.s);
  const popProg = Math.min(1, dtChunk / 0.18);
  const popEase = easeOutBack(popProg);
  const subScale = 0.97 + 0.03 * popEase;
  const subY = (1 - popEase) * 8 + (1 - gapAlpha) * 8;
  subCard.style.opacity = gapAlpha.toFixed(3);
  subCard.style.transform = `translate3d(0, ${subY.toFixed(1)}px, 0) scale(${subScale.toFixed(3)})`;

  let activeIdx = 0;
  for (let i = 0; i < activeChunk.wordTimes.length; i++) {
    if (t >= activeChunk.wordTimes[i].ws) activeIdx = i;
  }

  subCard.innerHTML = activeChunk.wordTimes.map((wt, idx) => {
    const stateCls = idx < activeIdx ? 'w past' : (idx === activeIdx ? 'w active' : 'w future');
    return `<span class="${stateCls}">${wt.word}</span>`;
  }).join(' ');
}

function render(t) {
  updateHUD(t);
  const tr = $('#time-readout');
  if (tr) tr.textContent = `${t.toFixed(1).padStart(4, '0')}s / 59.6s`;

  const dm = S.darkMode;
  hemi.intensity = 1.68 - dm * 1.12;
  sun.intensity = 2.28 - dm * 1.72;
  rim.intensity = 0.88 + dm * 0.55;

  camera.fov = S.fov;
  camera.updateProjectionMatrix();
  camera.position.set(S.camX, S.camY, S.camZ);
  camera.lookAt(S.lookX, S.lookY, S.lookZ);

  const kn = S.cKneel;
  const breath = Math.sin(t * 2.6) * 0.012;
  RAKA.root.position.set(S.cX, S.cY + breath, S.cZ);
  RAKA.root.rotation.y = S.cRotY;
  RAKA.bodyPivot.position.y = 0.72 - kn * 0.22;
  RAKA.armL.rotation.x = S.cArmL;
  RAKA.armR.rotation.x = S.cArmR;

  const cut = S.cutawayAlpha;
  switchCoverGroup.position.x = cut * 0.42;
  switchCoverGroup.position.z = 0.055 + cut * 0.05;
  switchCoverGroup.rotation.y = cut * 0.48;
  conduitPipe.visible = cut > 0.05;
  wireRed.visible = cut > 0.05;
  wireBlue.visible = cut > 0.05;

  switchRocker.rotation.x = (S.rockerTilt - 0.5) * 0.35;
  copperTop.position.y = 0.095 - S.copperClose * 0.038;
  copperBot.position.y = -0.095 + S.copperClose * 0.038;
  copperBot.rotation.z = (1 - S.copperClose) * 0.18;

  sparkBurst.visible = S.sparkScale > 0.01;
  const spPulse = 0.88 + 0.24 * Math.sin(t * 24.0);
  sparkBurst.scale.setScalar(Math.max(0.001, S.sparkScale * spPulse));
  sparkBurst.rotation.z = t * 4.5;
  sparkLight.intensity = S.sparkScale * 4.2 * spPulse;

  switchRing.scale.setScalar(Math.max(0.001, S.ringScale));
  switchRingMat.opacity = S.ringAlpha;

  gasVolumeGroup.visible = S.gasOpacity > 0.01;
  gasVolumeGroup.position.x = -0.05 + S.gasFlushX;
  gasSlabMat.opacity = S.gasOpacity * 0.60;
  gasRiseSlab.visible = S.gasRise > 0.01;
  gasRiseMat.opacity = S.gasRise * 0.46;
  gasRiseSlab.scale.y = Math.max(0.05, S.gasRise);
  gasRiseSlab.position.y = 0.35 + S.gasRise * 0.72;

  leakPuffs.forEach((pf, i) => {
    const showLeak = S.gasOpacity > 0.2 && S.regLift < 0.5;
    pf.visible = showLeak;
    if (showLeak) {
      const lp = (t * 0.55 + i * 0.25) % 1;
      pf.position.set(
        1.24 - lp * 0.35 + Math.sin(lp * 6 + i) * 0.08,
        1.15 - lp * 0.62,
        -1.88 + lp * 0.45
      );
      const sc = Math.sin(lp * Math.PI) * (0.65 + lp * 0.85);
      pf.scale.setScalar(Math.max(0.001, sc));
    }
  });

  regulatorGroup.position.y = 0.83 + S.regLift * 0.46;
  regSwitch.rotation.y = S.regLift * (Math.PI * 0.5);
  winSashLPivot.rotation.y = S.winOpen * 1.18;
  winSashRPivot.rotation.y = -S.winOpen * 1.18;
  doorPivot.rotation.y = S.doorOpen * 1.18;

  airflowGroup.visible = S.airOpacity > 0.01;
  airArrows.forEach((ar) => {
    const sp = ar.userData;
    const p = (t * 0.68 + sp.phase) % 1;
    ar.position.x = -3.15 + p * 4.45;
    ar.position.y = sp.y - p * 0.22;
    ar.position.z = sp.z;
    const sc = Math.sin(p * Math.PI) * S.airOpacity;
    ar.scale.setScalar(Math.max(0.001, sc));
  });

  const c2Target = (t < 25.20)
    ? new THREE.Vector3(0.65, 0.55, -0.35)
    : new THREE.Vector3(1.45, 1.55, -1.95);
  const c2OffX = (t < 25.20) ? 115 : -145;
  const c2OffY = (t < 25.20) ? -145 : -150;

  const c3Target = (t >= 39.5 && t < 43.6)
    ? new THREE.Vector3(1.72, 1.94, -2.58)
    : (t >= 47.4 ? new THREE.Vector3(-2.65, 1.85, 0.25) : new THREE.Vector3(1.24, 1.48, -1.92));
  const c3OffX = (t >= 47.4) ? 145 : (t >= 43.6 ? 115 : -135);
  const c3OffY = (t >= 43.6 && t < 47.4) ? -175 : -165;

  setCalloutLine('#line-c1', '#dot-c1', $('#call1'), new THREE.Vector3(1.68, 1.94, -2.60), -145, -170, S.c1Alpha);
  setCalloutLine('#line-c2', '#dot-c2', $('#call2'), c2Target, c2OffX, c2OffY, S.c2Alpha);
  setCalloutLine('#line-c3', '#dot-c3', $('#call3'), c3Target, c3OffX, c3OffY, S.c3Alpha);

  renderer.render(scene, camera);
}

/* ============ 6. STAGE SCALE & DETERMINISTIC CAPTURE HOOKS ============ */
const stage = $('#stage');
const fit = () => {
  const s = Math.min(innerWidth / W, innerHeight / H);
  stage.style.transform = `translate(-50%,-50%) scale(${s})`;
};
addEventListener('resize', fit);
fit();

const audioEl = $('#vo-audio');
let isPlaying = false;

(function frame() {
  if (isPlaying && !audioEl.paused) {
    tl.time(audioEl.currentTime, false);
  }
  render(tl.time());
  requestAnimationFrame(frame);
})();

$('#btn-play').onclick = () => {
  if (audioEl.paused) {
    isPlaying = true;
    audioEl.play();
    tl.play(audioEl.currentTime);
    $('#btn-play').textContent = '⏸ Pause';
  } else {
    isPlaying = false;
    audioEl.pause();
    tl.pause();
    $('#btn-play').textContent = '▶ Play Master + Audio';
  }
};

document.querySelectorAll('#switcher button[data-t]').forEach(btn => {
  btn.onclick = () => {
    const t = parseFloat(btn.dataset.t);
    isPlaying = false;
    audioEl.pause();
    audioEl.currentTime = t;
    tl.pause(t);
    render(t);
    $('#btn-play').textContent = '▶ Play Master + Audio';
  };
});

const seek = (t) => {
  document.body.classList.add('clean-snap');
  isPlaying = false;
  tl.pause();
  tl.time(t, false);
  if (gsap.ticker.tick) gsap.ticker.tick();
  render(t);
};

window.OPENER = {
  tl,
  DURATION,
  W,
  H,
  seek,
  S,
  render,
  ready: false
};

document.fonts.ready.then(() => {
  window.OPENER.ready = true;
  if (!Q.has('clean')) render(0);
});
</script>
